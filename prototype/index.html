<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takip — Sipariş ve Üretim Portalı</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{height:100%;} ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans text-sm">
<div id="app"></div>
<script>
const STATUS = {
  YENI:{l:'İnceleniyor',c:'bg-slate-200 text-slate-700'},
  CIZIM_GEREKLI:{l:'Çizim Gerekli',c:'bg-purple-100 text-purple-700'},
  CIZIM_YAPILIYOR:{l:'Çizim Yapılıyor',c:'bg-purple-200 text-purple-800'},
  DXF_DWG_GELDI:{l:'Hazır Çizim Geldi',c:'bg-indigo-100 text-indigo-700'},
  ONAY_BEKLIYOR:{l:'Onayınız Bekleniyor',c:'bg-amber-100 text-amber-700'},
  REVIZYON_ISTENDI:{l:'Revizyon İstendi',c:'bg-red-100 text-red-700'},
  FIYAT_BEKLIYOR:{l:'Teklife Gönderildi',c:'bg-emerald-100 text-emerald-700'},
  FIYATLANDI:{l:'Fiyatlandı',c:'bg-emerald-100 text-emerald-700'},
  URETIMDE:{l:'Onaylandı, Üretimde',c:'bg-blue-100 text-blue-700'},
  ESKALASYON:{l:'Eskalasyon',c:'bg-red-200 text-red-800'},
  YUKLENDI:{l:'Yüklendi',c:'bg-teal-100 text-teal-700'},
  ARSIVLENDI:{l:'Arşivlendi',c:'bg-slate-100 text-slate-500'},
  IPTAL:{l:'İptal',c:'bg-slate-100 text-slate-400 line-through'},
};
const ROLES=['MUSTERI','SATIS','ADMIN','CIZIM'];
const ROLE_LABEL={MUSTERI:'Müşteri',SATIS:'Satış',ADMIN:'Sistem Yöneticisi',CIZIM:'Çizim Ekibi'};
const CATALOG=['4mm Temperli Cam','6mm Temperli Cam','8mm Temperli Cam','10mm Temperli Cam','6mm Lamine Cam (33.1)','8mm Lamine Cam (44.1)','Isıcam (4+16+4)','Ayna 4mm'];
const STAGES=['Alındı','Satış incelemesi','Çizim','Onay ve teklif'];
const NAV_MUSTERI=[['orders','Siparişlerim'],['new','Yeni Sipariş'],['shipments','Yüklemelerim'],['archive','Arşiv'],['settings','Ayarlar'],['help','Yardım']];
const NAV_SATIS=[['dashboard','Satış'],['offers','Teklifler'],['shipments','Yüklemeler'],['all','Tüm Siparişler'],['archive','Arşiv'],['help','Yardım']];
const NAV_ADMIN=[['offers','Teklifler'],['all','Tüm Siparişler'],['shipments','Yüklemeler'],['archive','Arşiv'],['help','Yardım'],['#','KİŞİLER'],['users','Kullanıcılar'],['firms','Müşteriler']];
const NAV_CIZIM=[['all','Siparişler'],['help','Yardım']];
function navFor(){return state.role==='MUSTERI'?NAV_MUSTERI:state.role==='SATIS'?NAV_SATIS:state.role==='ADMIN'?NAV_ADMIN:NAV_CIZIM;}
function defaultPage(){return state.role==='MUSTERI'?'orders':state.role==='SATIS'?'dashboard':state.role==='ADMIN'?'offers':'all';}

function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function addHours(d,n){const x=new Date(d);x.setHours(x.getHours()+n);return x;}
function iso(d){return new Date(d).toISOString();}
function mkOrder(orderNo,customerId,title,status,needsDrawing,items,shipInDays,opts){
  opts=opts||{};
  const o={id:orderNo,orderNo,customerId,title,customerOrderNo:opts.customerOrderNo||String(Math.floor(Math.random()*90)+1),
    status:'YENI',needsDrawing,revisionCount:0,onHold:false,eskalasyon:!!opts.eskalasyon,
    items:items.map((it,i)=>({id:orderNo+'-i'+i,...it})),
    offer:null,price:null,drawing:null,notes:[],files:opts.files||[],
    estimatedShipDate:iso(addDays(new Date(),shipInDays)),
    history:[{from:null,to:'YENI',at:iso(addHours(new Date(),-40)),note:'Sipariş oluşturuldu'}]};
  if(status!=='YENI'){o.status=status;o.history.push({from:'YENI',to:status,at:iso(addHours(new Date(),-20)),note:null});}
  return o;
}
let state = migrate(load()) || migrate({
  role:'MUSTERI', activeCustomerId:'c1', page:'orders',
  session:null, users:defaultUsers(),
  customers:[
    {id:'c1',name:'GLASSANDMORE',prefix:'GLA',contactPerson:'Lucian'},
    {id:'c2',name:'FOL Expert',prefix:'FOL',contactPerson:'Mitariu'},
    {id:'c3',name:'Pelet Construct',prefix:'PEL',contactPerson:'Gabi'},
    {id:'c4',name:'Mirela Construct',prefix:'MIR',contactPerson:'Darius'},
  ],
  orders:[
    mkOrder('GLA59','c1','Minda','FIYAT_BEKLIYOR',false,[{camAdedi:6,metraj:'4.20',netAgirlik:'50.0',cnc:null,delikSayisi:null}],3),
    mkOrder('GLA58','c1','Vitrin camı','ONAY_BEKLIYOR',true,[{camAdedi:6,metraj:'14.2',netAgirlik:'210.5',cnc:'Köşe kesim',delikSayisi:4}],5),
    mkOrder('GLA55','c1','Duş kabini','URETIMDE',false,[{camAdedi:4,metraj:'5.6',netAgirlik:'70.0',cnc:null,delikSayisi:null}],2),
    mkOrder('GLA50','c1','Balkon korkuluk','YUKLENDI',true,[{camAdedi:20,metraj:'32.0',netAgirlik:'480.0',cnc:null,delikSayisi:2}],-6),
    mkOrder('GLA48','c1','Cephe camı','ARSIVLENDI',false,[{camAdedi:30,metraj:'60.0',netAgirlik:'900.0',cnc:null,delikSayisi:null}],-20),
    mkOrder('FOL4','c2','Gabi panou dus','CIZIM_YAPILIYOR',true,[{camAdedi:6,metraj:'14.2',netAgirlik:'210.5',cnc:'Köşe kesim',delikSayisi:4}],-3,{eskalasyon:true}),
    mkOrder('FOL3','c2','Merdiven korkuluğu','CIZIM_YAPILIYOR',true,[{camAdedi:15,metraj:'22.0',netAgirlik:'300.0',cnc:'Delikli',delikSayisi:8}],-2,{eskalasyon:true}),
    mkOrder('PEL10','c3','Balkon korkuluk camı','FIYATLANDI',false,[{camAdedi:20,metraj:'32.0',netAgirlik:'480.0',cnc:null,delikSayisi:2}],4),
    mkOrder('MIR5','c4','Darius','YENI',null,[{camAdedi:1,metraj:'0',netAgirlik:'0',cnc:null,delikSayisi:null}],1,{files:[{name:'Darius.dwg',size:'37,8 KB',version:1}]}),
    mkOrder('MIR6','c4','Ofis bölme camı','YENI',null,[{camAdedi:8,metraj:'11.1',netAgirlik:'150.0',cnc:null,delikSayisi:null}],1),
  ],
  nextSeq:{GLA:61,FOL:6,PEL:12,MIR:7},
});
save();
function save(){try{localStorage.setItem('takip_state_v4',JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem('takip_state_v4');return s?JSON.parse(s):null;}catch(e){return null;}}
function migrate(s){
  if(!s) return s;
  if(!s.users) s.users=defaultUsers(); if(s.session===undefined) s.session=null;
  if(!s.groups) s.groups=[];
  s.customers=s.customers||[];
  s.customers.forEach(c=>{ if(!c.type) c.type='CUSTOMER'; c.group=c.group||''; c.camEtiket=c.camEtiket||''; c.sandikEtiket=c.sandikEtiket||''; });
  if(!s.customers.some(c=>c.type==='FACTORY')) s.customers.push({id:'f1',name:'GKH Trading',prefix:'GKH',type:'FACTORY',group:'',camEtiket:'',sandikEtiket:'',contactPerson:''});
  const fac=s.customers.find(c=>c.type==='FACTORY');
  s.users.forEach(u=>{ u.name=u.name||''; u.phone=u.phone||''; u.unit=u.unit||''; if(u.role!=='MUSTERI'&&!u.customerId) u.customerId=fac.id; if(u.canApprove===undefined) u.canApprove=(u.role==='MUSTERI'); if(u.invited===undefined) u.invited=true; });
  (s.orders||[]).forEach(o=>{
    o.notes=o.notes||[]; o.files=o.files||[]; o.onHold=!!o.onHold; o.eskalasyon=!!o.eskalasyon;
    if(o.needsDrawing===undefined) o.needsDrawing=false;
    if(o.customerOrderNo===undefined) o.customerOrderNo=String(Math.floor(Math.random()*90)+1);
  });
  return s;
}
function cust(id){return state.customers.find(c=>c.id===id)||{};}
function custName(id){return cust(id).name||'—';}
function custPrefix(id){return cust(id).prefix||'ORD';}
function maskName(name){return (name||'').slice(0,3)+'**********';}
function fmt(n){return Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(iso_){return new Date(iso_).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtDateTime(iso_){return new Date(iso_).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function totalItems(o){return o.items.reduce((s,i)=>s+Number(i.metraj),0);}
function visibleOrders(){return state.role==='MUSTERI'?state.orders.filter(o=>o.customerId===state.activeCustomerId):state.orders;}
function advance(o,to,note){o.history.push({from:o.status,to,at:new Date().toISOString(),note:note||null});o.status=to;save();render();}
function stageIndex(o){
  if(o.status==='YENI') return 1;
  if(['CIZIM_GEREKLI','CIZIM_YAPILIYOR','DXF_DWG_GELDI'].includes(o.status)) return 2;
  return 3;
}
function slaInfo(o){
  if(['YUKLENDI','ARSIVLENDI','IPTAL'].includes(o.status)) return null;
  const deadline = new Date(o.history[0].at); deadline.setHours(deadline.getHours()+40);
  const diffH = (deadline - new Date())/36e5;
  if(diffH>=0) return {text:diffH.toFixed(1)+' sa kaldı',over:false};
  return {text:Math.abs(diffH).toFixed(1)+' sa gecikme',over:true};
}
function cizimText(o){ if(!o.needsDrawing) return 'Çizimsiz'; return (o.drawing?o.drawing.version:0)+' çizim'; }
function revText(o){ return o.revisionCount>0?('v'+(o.revisionCount+1)+' · '+o.revisionCount+' tur'):'—'; }

// ---- ACTIONS ----
function actionSatisCizimGerekli(o){o.needsDrawing=true;advance(o,'CIZIM_GEREKLI');}
function actionSatisBeklemeyeAl(o){o.onHold=true;save();render();}
function actionCikarBeklemeden(o){o.onHold=false;save();render();}
function actionOpenOfferDraft(o){o.offer=o.offer||{status:'hazırlanıyor',firma:custName(o.customerId),proje:o.title,camEtiket:'',sandikEtiket:'',termin:fmtDate(o.estimatedShipDate),lines:[{desc:CATALOG[0],en:'',boy:'',adet:1,metraj:'0',fiyat:'0'}]};o.offerEditing=true;save();render();}
function addOfferLine(o){o.offer.lines.push({desc:CATALOG[0],en:'',boy:'',adet:1,metraj:'0',fiyat:'0'});save();render();}
function removeOfferLine(o,i){o.offer.lines.splice(i,1);save();render();}
function offerTotal(o){return o.offer.lines.reduce((s,l)=>s+Number(l.metraj||0)*Number(l.fiyat||0),0);}
function submitOfferToAdmin(o){o.offer.status='yönetimde';o.offerEditing=false;advance(o,'FIYAT_BEKLIYOR');}
function actionCizimBasla(o){advance(o,'CIZIM_YAPILIYOR');}
function actionCizimYukle(o){o.drawing={fileUrl:'cizim_v1.dxf',version:1};advance(o,'ONAY_BEKLIYOR');}
function actionCizimRevizeGonder(o){if(o.drawing)o.drawing.version=(o.drawing.version||1)+1;advance(o,'ONAY_BEKLIYOR');}
function actionMusteriOnayla(o){const u=currentUser();if(!u||!u.canApprove)return;advance(o,'URETIMDE');}
function actionMusteriRevizyon(o){const c=prompt('Revizyon notu:');if(c===null)return;o.revisionCount=(o.revisionCount||0)+1;o.lastRevisionNote=c;advance(o,'REVIZYON_ISTENDI');}
function actionAdminFinalizeOffer(o){
  const camEtiket=document.getElementById('camEtiket')?.value||'';
  const sandikEtiket=document.getElementById('sandikEtiket')?.value||'';
  o.offer.camEtiket=camEtiket; o.offer.sandikEtiket=sandikEtiket; o.offer.status='gönderildi';
  o.price={amount:offerTotal(o).toFixed(2)};
  advance(o,'FIYATLANDI');
}
function actionYukle(o){o.actualShipDate=new Date().toISOString();advance(o,'YUKLENDI');}
function actionArsivle(o){advance(o,'ARSIVLENDI');}
function addNote(o,text,internal){if(!text)return;o.notes.push({text,internal,at:new Date().toISOString(),by:ROLE_LABEL[state.role]});save();render();}
function addFile(o){o.files.push({name:'ek_dosya_v'+(o.files.length+1)+'.pdf',size:'—',version:o.files.length+1});save();render();}

let selectedOrderId=null, newOrderDraft={files:0, glasses:[{cat:CATALOG[0],qty:1}]}, calMonth=new Date();

function render(){
  const app=document.getElementById('app');
  const cu=currentUser();
  if(!cu){ app.innerHTML=authScreen(); wireAuth(); return; }
  state.role=cu.role; if(cu.role==='MUSTERI') state.activeCustomerId=cu.customerId;
  app.innerHTML=`<div class="min-h-screen flex">
    ${sidebar()}
    <div class="flex-1 flex flex-col min-w-0">
      ${topbar()}
      <div class="flex-1 overflow-y-auto p-4 md:p-6">${pageBody()}</div>
    </div>
  </div>${selectedOrderId?detailModal():''}`;
  wire();
}
function sidebar(){
  const nav=navFor();
  return `<div class="hidden md:flex w-60 shrink-0 bg-white border-r border-slate-200 flex-col p-4 overflow-y-auto">
    <div class="flex items-center gap-2 mb-1"><span class="font-bold text-lg">TAKİP</span><span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">v2.25</span></div>
    <div class="text-[11px] text-slate-400 mb-6">SİPARİŞ VE ÜRETİM PORTALI</div>
    <div class="text-[11px] font-semibold text-slate-400 mb-2">${state.role==='MUSTERI'?'MÜŞTERİ PORTALI':'OPERASYON'}</div>
    <nav class="space-y-1">${nav.map(([k,l])=>k==='#'?`<div class="text-[11px] font-semibold text-slate-400 pt-4 pb-1 px-1">${l}</div>`:`<button data-nav="${k}" class="navBtn w-full text-left px-3 py-2 rounded-md text-sm font-medium ${state.page===k?'bg-blue-600 text-white':'text-slate-600 hover:bg-slate-50'}">${l}</button>`).join('')}</nav>
  </div>`;
}
function topbar(){
  const u=currentUser()||{};
  const c=cust(u.customerId);
  const sub=u.role==='MUSTERI'?('Müşteri · '+(c.name||'')):ROLE_LABEL[u.role];
  return `<div class="sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between gap-3" style="padding-top:calc(0.75rem + env(safe-area-inset-top,0px))">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-xs shrink-0">${esc((u.email||'?')[0].toUpperCase())}</div>
      <div class="min-w-0"><div class="font-semibold text-sm truncate">${esc(u.name||u.email||'')}</div>
      <div class="text-[11px] text-slate-400 truncate">${esc(sub)}</div></div>
    </div>
    <button id="logoutBtn" class="text-xs text-blue-800 font-medium px-3 py-1.5 rounded-md hover:bg-slate-50 shrink-0">Çıkış</button>
  </div>
  <div class="md:hidden flex gap-1 overflow-x-auto px-3 py-2 bg-white border-b border-slate-200">${navFor().filter(([k])=>k!=='#').map(([k,l])=>`<button data-nav="${k}" class="navBtn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium ${state.page===k?'bg-blue-600 text-white':'bg-slate-100 text-slate-600'}">${l}</button>`).join('')}</div>`;
}
function pageBody(){
  if(state.role==='MUSTERI'){
    if(state.page==='new') return newOrderPage();
    if(state.page==='shipments') return shipmentsPage();
    if(state.page==='archive') return archivePage();
    if(state.page==='settings') return staticPage('Ayarlar','Bildirim tercihleri, dil ve hesap ayarları burada yer alacak.');
    if(state.page==='help') return staticPage('Yardım','Sorularınız için satış temsilcinizle iletişime geçebilirsiniz.');
    return ordersPage();
  }
  if(state.page==='users'&&state.role==='ADMIN') return usersPage();
  if(state.page==='firms'&&state.role==='ADMIN') return firmsPage();
  if(state.page==='dashboard') return satisDashboard();
  if(state.page==='offers') return offersPage();
  if(state.page==='shipments') return shipmentsPage();
  if(state.page==='archive') return archivePage();
  if(state.page==='help') return staticPage('Yardım','Sorularınız için sistem yöneticinizle iletişime geçin.');
  return allOrdersPage();
}
function staticPage(title,text){return `<div class="max-w-lg"><h2 class="text-lg font-bold mb-2">${title}</h2><p class="text-slate-500">${text}</p></div>`;}

// ---- internal grouped table ----
function groupByShip(orders){
  const groups={};
  orders.slice().sort((a,b)=>new Date(a.estimatedShipDate)-new Date(b.estimatedShipDate)).forEach(o=>{
    const k=fmtDate(o.estimatedShipDate);
    (groups[k]=groups[k]||[]).push(o);
  });
  return groups;
}
function internalTable(orders,opts){
  opts=opts||{};
  const groups=groupByShip(orders);
  const searchId='srch'+(opts.id||'');
  return `
  <div class="flex flex-wrap items-center gap-2 mb-3">
    <input placeholder="Sipariş no / başlık ara" class="flex-1 min-w-[160px] border border-slate-300 rounded-md px-3 py-1.5 text-xs">
    <select class="border border-slate-300 rounded-md px-2 py-1.5 text-xs"><option>En yeni</option></select>
    <label class="flex items-center gap-1 text-xs text-slate-500"><input type="checkbox" checked> Yüklemeye göre grupla</label>
    <button class="text-xs border border-slate-300 rounded-md px-3 py-1.5">Yenile</button>
  </div>
  <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto">
    <table class="w-full text-xs min-w-[700px]">
      <thead><tr class="text-slate-400 border-b border-slate-100"><th class="text-left px-3 py-2">SİPARİŞ</th><th class="text-left px-3 py-2">MÜŞTERİ</th><th class="text-left px-3 py-2">DURUM</th><th class="text-left px-3 py-2">ÇİZİM</th><th class="text-left px-3 py-2">REVİZYON</th><th class="text-left px-3 py-2">SLA</th><th class="text-left px-3 py-2">TAHMİNİ YÜKLEME</th><th></th></tr></thead>
      <tbody>
      ${Object.keys(groups).length?Object.entries(groups).map(([d,list])=>`
        <tr><td colspan="8" class="px-3 py-1.5 bg-slate-50 text-[11px] font-semibold text-slate-500">YÜKLEME: ${d} <span class="ml-1 bg-slate-200 text-slate-500 rounded-full px-1.5">${list.length}</span></td></tr>
        ${list.map(o=>{const sla=slaInfo(o);return `
        <tr class="orderRow border-b border-slate-50 hover:bg-slate-50 cursor-pointer" data-order="${o.id}">
          <td class="px-3 py-2"><div class="font-semibold text-blue-700">${o.orderNo}</div><div class="text-slate-400">${o.title||''}</div></td>
          <td class="px-3 py-2 text-slate-500">${maskName(custName(o.customerId))}</td>
          <td class="px-3 py-2"><span class="px-2 py-0.5 rounded-full font-medium ${STATUS[o.status].c}">${STATUS[o.status].l}</span>${o.eskalasyon?'<span class="ml-1 px-2 py-0.5 rounded-full font-medium bg-red-100 text-red-700">eskalasyon</span>':''}</td>
          <td class="px-3 py-2 text-slate-500">${cizimText(o)}</td>
          <td class="px-3 py-2 text-slate-500">${revText(o)}</td>
          <td class="px-3 py-2 ${sla&&sla.over?'text-red-500':'text-slate-500'}">${sla?sla.text:'—'}</td>
          <td class="px-3 py-2 text-slate-500">${fmtDate(o.estimatedShipDate)}</td>
          <td class="px-3 py-2"><button class="text-xs border border-slate-300 rounded-md px-2.5 py-1">Aç</button></td>
        </tr>`;}).join('')}
      `).join(''):`<tr><td colspan="8" class="text-center text-slate-400 py-8">Sipariş yok</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function satisDashboard(){
  const orders=visibleOrders();
  const karar=orders.filter(o=>o.status==='YENI'&&!o.onHold);
  const risk=orders.filter(o=>!['YUKLENDI','ARSIVLENDI','IPTAL','YENI'].includes(o.status)&&(o.eskalasyon||(slaInfo(o)&&slaInfo(o).over)));
  return `<h1 class="text-xl font-bold mb-4">Satış Paneli</h1>
  <div class="mb-2 flex items-center gap-2"><h2 class="font-semibold">Yeni Siparişler — karar bekliyor</h2><span class="text-xs bg-slate-200 text-slate-600 rounded-full px-2 py-0.5">${karar.length}</span></div>
  ${internalTable(karar,{id:'k'})}
  <div class="mt-6 mb-2 flex items-center gap-2"><h2 class="font-semibold">SLA riski / gecikenler</h2><span class="text-xs bg-red-100 text-red-600 rounded-full px-2 py-0.5">${risk.length}</span></div>
  ${internalTable(risk,{id:'r'})}`;
}
function allOrdersPage(){
  const orders=visibleOrders().filter(o=>o.status!=='ARSIVLENDI');
  return `<h1 class="text-xl font-bold mb-1">Tüm Siparişler</h1>
  <div class="mb-3 flex items-center gap-2"><span class="font-semibold text-sm">Aktif siparişler</span><span class="text-xs bg-slate-200 text-slate-600 rounded-full px-2 py-0.5">${orders.length}</span></div>
  ${internalTable(orders,{id:'all'})}`;
}
function offersPage(){
  const orders=visibleOrders().filter(o=>o.offer);
  return `<h1 class="text-xl font-bold mb-1">Teklifler</h1>
  <p class="text-slate-500 text-xs mb-4">Hazırlanan, yönetimde bekleyen ve müşteriye gönderilmiş teklifler.</p>

function shipmentsPage(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();

  const today=new Date();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push('');

function wireAuth(){
  document.querySelectorAll('.langBtn').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang!=='TR'){auth.info='Bu prototipte yalnızca Türkçe arayüz var.';render();}}));
  document.querySelectorAll('.demoFill').forEach(b=>b.addEventListener('click',()=>{document.getElementById('lgEmail').value=b.dataset.email;document.getElementById('lgPass').value=b.dataset.pass||'';}));
  document.getElementById('loginForm')?.addEventListener('submit',e=>{
    e.preventDefault(); auth.info='';
    const email=document.getElementById('lgEmail').value.trim().toLowerCase();
    const pass=document.getElementById('lgPass').value;
    auth.email=email; auth.error='';
    const u=findUser(email);
    if(u&&!u.passwordSet){ if(u.invited===false){auth.error='E-posta veya şifre hatalı.';render();return;} auth.view='setup_code';auth.codeOk=false;render();return;}
    if(!u||u.password!==pass){auth.error='E-posta veya şifre hatalı.';render();return;}
    doLogin(u);
  });
  document.getElementById('codeForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const u=findUser(auth.email); const c=document.getElementById('codeInput').value.trim();
    if(!u||u.passwordSet||u.invited===false||u.code!==c){auth.error='Doğrulama kodu hatalı.';render();return;}
    auth.error='';auth.codeOk=true;auth.view='setup_pass';render();
  });
  document.getElementById('passForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const u=findUser(auth.email);
    if(!u||u.passwordSet||!auth.codeOk){resetAuth(auth.email);render();return;}
    const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
    if(p1.length<8||!/\p{L}/u.test(p1)||!/\d/.test(p1)){auth.error='Şifre en az 8 karakter olmalı; en az bir harf ve bir rakam içermeli.';render();return;}
    if(p1!==p2){auth.error='Şifreler eşleşmiyor.';render();return;}
    u.password=p1;u.passwordSet=true;u.code=null;save();doLogin(u);
  });
  document.getElementById('backToLogin')?.addEventListener('click',()=>{resetAuth(auth.email);render();});
}

const ROLE_CHIPS=[['MUSTERI','Müşteri'],['SATIS','Satış'],['CIZIM','Çizimci']];
const TR_ASCII={'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U'};
function cleanPrefix(v){return (v||'').replace(/[çğıöşüÇĞİÖŞÜ]/g,c=>TR_ASCII[c]).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);}
function suggestPrefix(name){return cleanPrefix(name).slice(0,3);}
function prefixTaken(p,exceptId){return state.customers.some(c=>c.id!==exceptId&&c.prefix===p);}
function nameTaken(n,exceptId){const k=(n||'').trim().toLowerCase();return state.customers.some(c=>c.id!==exceptId&&c.name.trim().toLowerCase()===k);}
function firmUserCount(id){return state.users.filter(u=>u.customerId===id).length;}
function firmOrderCount(id){return state.orders.filter(o=>o.customerId===id).length;}
function contactOf(id){const c=cust(id); if(c.contactPerson) return c.contactPerson; const u=state.users.find(x=>x.customerId===id&&x.role==='MUSTERI'&&x.name); return u?u.name:'';}
function groupOptions(sel,emptyLabel){return `<option value="">${emptyLabel}</option>`+state.groups.map(g=>`<option value="${esc(g)}" ${g===sel?'selected':''}>${esc(g)}</option>`).join('');}
function firmsForRole(role){ if(role==='MUSTERI') return state.customers.filter(c=>c.type==='CUSTOMER'); if(role) return state.customers.filter(c=>c.type==='FACTORY'); return state.customers; }
function freshFirmForm(){return {name:'',type:'CUSTOMER',prefix:'',group:'',newGroup:'',cam:'',sandik:''};}
function freshUserForm(){return {email:'',name:'',unit:'',phone:'',firm:'',role:'',approve:false,invite:true};}
firmsPage.form=freshFirmForm(); firmsPage.notice=null; firmsPage.tableErr=''; firmsPage.editing=null;
usersPage.form=freshUserForm(); usersPage.notice=''; usersPage.confirm=null;

const LBL='text-xs text-slate-500';
function switchHtml(id,label,checked,disabled){
  return `<label class="flex items-center gap-3 text-sm ${disabled?'opacity-50':'cursor-pointer'}"><span>${label}</span><input id="${id}" type="checkbox" class="peer sr-only" ${checked?'checked':''} ${disabled?'disabled':''}><span class="relative w-11 h-6 rounded-full bg-slate-300 peer-checked:bg-blue-800 transition after:absolute after:top-0.5 after:left-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-5"></span></label>`;
}
function createBtnCls(ok){return 'px-5 py-2 rounded-md text-sm font-medium text-white '+(ok?'bg-blue-800':'bg-blue-300 cursor-not-allowed');}

// ---------- MÜŞTERİLER (FİRMALAR) ----------
function firmsPage(){
  const f=firmsPage.form; const notice=firmsPage.notice; firmsPage.notice=null;
  const tErr=firmsPage.tableErr; firmsPage.tableErr='';
  const ok=f.name.trim().length>0;
  return `<h1 class="text-xl font-bold mb-1">Müşteriler</h1>
  <p class="text-slate-500 text-xs mb-4">Önce firmayı burada oluşturun; ardından <b>Kullanıcılar</b> sekmesinden bu firmaya kullanıcı atayın.</p>
  ${notice?`<div class="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-md px-3 py-2 mb-4 flex items-center justify-between gap-3"><span>${esc(notice)}</span><button class="navBtn shrink-0 text-blue-800 font-medium underline" data-nav="users">Kullanıcı ata →</button></div>`:''}
  <div class="bg-white border border-slate-200 rounded-lg p-5 mb-5">
    <h3 class="font-semibold mb-3">Yeni firma</h3>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div><label class="${LBL}">Firma adı</label><input id="fName" value="${esc(f.name)}" class="${INP}"></div>
      <div><label class="${LBL}">Firma tipi</label><select id="fType" class="${INP}"><option value="CUSTOMER" ${f.type==='CUSTOMER'?'selected':''}>Müşteri firması (CUSTOMER)</option><option value="FACTORY" ${f.type==='FACTORY'?'selected':''}>Fabrika (FACTORY)</option></select></div>
      <div><label class="${LBL}">Sipariş no ön eki</label><input id="fPrefix" maxlength="5" value="${esc(f.prefix)}" placeholder="${esc(suggestPrefix(f.name)||'örn. GKH')}" class="${INP}"></div>
      <div><label class="${LBL}">Grup</label><select id="fGroup" class="${INP}">${groupOptions(f.group,'Grup yok')}<option value="__new" ${f.group==='__new'?'selected':''}>＋ Yeni grup…</option></select></div>
      <div id="fNewGroupWrap" style="display:${f.group==='__new'?'':'none'}"><label class="${LBL}">Yeni grup adı</label><input id="fNewGroup" value="${esc(f.newGroup)}" class="${INP}"></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
      <div><label class="${LBL} italic">Cam etiketi (varsayılan) — Bu firmanın siparişlerine varsayılan olarak yazılır.</label><input id="fCam" value="${esc(f.cam)}" class="${INP}"></div>
      <div><label class="${LBL} italic">Sandık etiketi (varsayılan) — Sandık etiketi fiziksel etikete ve nakliye listesine basılıyor; sonradan sipariş bazında değiştirilebilir.</label><input id="fSandik" value="${esc(f.sandik)}" class="${INP}"></div>
    </div>
    <div id="firmErr" class="text-xs text-red-600 mt-2"></div>
    <button id="createFirm" class="mt-3 ${createBtnCls(ok)}" ${ok?'':'disabled'}>Oluştur</button>
  </div>
  <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto">
    <div class="px-4 py-3"><h3 class="font-semibold">Firmalar (${state.customers.length})</h3>${tErr?`<div class="text-xs text-red-600 mt-1">${esc(tErr)}</div>`:''}</div>
    <table class="w-full text-xs min-w-[900px]">
      <thead><tr class="text-slate-400 bg-slate-50 border-y border-slate-100"><th class="text-left px-4 py-2">FİRMA</th><th class="text-left px-3 py-2">SİPARİŞ NO ÖN EKİ</th><th class="text-left px-3 py-2">CAM / SANDIK ETİKETİ</th><th class="text-left px-3 py-2">TİP</th><th class="text-left px-3 py-2">GRUP</th><th class="text-left px-3 py-2">KULLANICI</th><th class="text-left px-3 py-2">SİPARİŞ</th></tr></thead>
      <tbody>${state.customers.map(c=>`<tr class="border-b border-slate-50 align-top">
        <td class="px-4 py-3">${firmsPage.editing===c.id
          ?`<input class="fEditName border border-slate-300 rounded px-2 py-1 w-44" data-id="${c.id}" value="${esc(c.name)}"><div class="mt-1"><button class="fEditSave text-blue-700 font-medium" data-id="${c.id}">Kaydet</button> <button class="fEditCancel text-slate-500 ml-2">İptal</button></div>`
          :`<div class="font-semibold text-blue-700 text-sm">${esc(c.name)}</div><div class="text-slate-400">—</div><button class="fEdit text-blue-600 mt-1" data-id="${c.id}">Adı düzelt</button>`}</td>
        <td class="px-3 py-3"><input class="fPrefixIn w-24 border border-slate-300 rounded px-2 py-1.5" data-id="${c.id}" maxlength="5" value="${esc(c.prefix)}"></td>
        <td class="px-3 py-3 space-y-1"><input class="fCamIn block w-44 border border-slate-300 rounded px-2 py-1.5" data-id="${c.id}" placeholder="cam etiketi" value="${esc(c.camEtiket||'')}"><input class="fSandikIn block w-44 border border-slate-300 rounded px-2 py-1.5" data-id="${c.id}" placeholder="sandık etiketi" value="${esc(c.sandikEtiket||'')}"></td>
        <td class="px-3 py-3"><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold">${c.type}</span></td>
        <td class="px-3 py-3"><select class="fGroupSel border border-slate-300 rounded px-2 py-1.5" data-id="${c.id}">${groupOptions(c.group||'','Grupsuz')}</select></td>
        <td class="px-3 py-3">${firmUserCount(c.id)}</td><td class="px-3 py-3">${firmOrderCount(c.id)}</td></tr>`).join('')}</tbody>
    </table>
  </div>`;
}
function syncFirmForm(){
  const g=id=>document.getElementById(id); if(!g('fName')) return; const f=firmsPage.form;
  f.name=g('fName').value; f.type=g('fType').value; f.prefix=g('fPrefix').value; f.group=g('fGroup').value;
  f.newGroup=g('fNewGroup')?g('fNewGroup').value:''; f.cam=g('fCam').value; f.sandik=g('fSandik').value;
}

// ---------- KULLANICILAR ----------
function userFormValid(){const f=usersPage.form;return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((f.email||'').trim())&&!!f.role&&!!f.firm;}
function syncUserForm(){
  const g=id=>document.getElementById(id); if(!g('uEmail')) return; const f=usersPage.form;
  f.email=g('uEmail').value; f.name=g('uName').value; f.unit=g('uUnit').value; f.phone=g('uPhone').value;
  f.firm=g('uFirm').value; f.approve=!!(g('uApprove')&&g('uApprove').checked); f.invite=!!(g('uInvite')&&g('uInvite').checked);
}
function updateUserBtn(){
  syncUserForm(); const b=document.getElementById('createUser'); if(!b) return;
  const ok=userFormValid(); b.disabled=!ok; b.className='ml-auto '+createBtnCls(ok);
}
function usersPage(){
  const notice=usersPage.notice||''; usersPage.notice='';
  const f=usersPage.form; const me=currentUser()||{};
  const firms=firmsForRole(f.role);
  const ok=userFormValid();
  return `<h1 class="text-xl font-bold mb-1">Kullanıcılar</h1>
  <p class="text-slate-500 text-xs mb-4">Kullanıcıyı bir firmaya atayın; davet gittikten sonra kişi ilk girişte şifresini kendisi belirler. Firma yoksa önce <b>Müşteriler</b> sekmesinde oluşturun.</p>
  ${notice?`<div class="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-md px-3 py-2 mb-4">${esc(notice)}</div>`:''}
  <div class="bg-white border border-slate-200 rounded-lg p-5 mb-5">
    <h3 class="font-semibold mb-3">Yeni kullanıcı</h3>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div><label class="${LBL}">E-posta</label><input id="uEmail" type="email" value="${esc(f.email)}" class="${INP}"></div>
      <div><label class="${LBL}">Ad soyad</label><input id="uName" value="${esc(f.name)}" class="${INP}"></div>
      <div><label class="${LBL}">Birim etiketi</label><input id="uUnit" value="${esc(f.unit)}" placeholder="fabrika satış, fabrika çizim..." class="${INP}"></div>
      <div><label class="${LBL}">Telefon</label><input id="uPhone" value="${esc(f.phone)}" class="${INP}"></div>
      <div><label class="${LBL}">Firma / fabrika</label><select id="uFirm" class="${INP}"><option value="">— firma seçin —</option>${firms.map(c=>`<option value="${c.id}" ${c.id===f.firm?'selected':''}>${esc(c.name)}${c.type==='FACTORY'?' (fabrika)':''}</option>`).join('')}</select></div>
    </div>
    <div class="mt-4"><div class="${LBL} mb-1">Bu kişi ne yapacak?</div>
      <div class="flex flex-wrap gap-2">${ROLE_CHIPS.map(([r,l])=>`<button type="button" data-role="${r}" class="roleChip px-4 py-2 rounded-lg border text-sm ${f.role===r?'bg-blue-800 text-white border-blue-800':'bg-white text-slate-700 border-slate-300'}">${l}</button>`).join('')}</div>
      ${!f.role?'<div class="text-xs text-slate-400 mt-1">Bir rol seçin</div>':''}
      ${f.role==='MUSTERI'&&!firms.length?`<div class="text-xs text-amber-700 mt-2">Henüz müşteri firması yok. Önce <button class="navBtn underline" data-nav="firms">Müşteriler</button> sekmesinde firma oluşturun.</div>`:''}
    </div>
    <div class="flex flex-wrap items-center gap-x-8 gap-y-3 mt-5">
      ${switchHtml('uApprove','Onay yetkisi (müşteri tarafında onaylayabilir)',f.approve,f.role!=='MUSTERI')}
      ${switchHtml('uInvite','Davet e-postası gönder',f.invite,false)}
      <button id="createUser" ${ok?'':'disabled'} class="ml-auto ${createBtnCls(ok)}">Oluştur</button>
    </div>
    <div id="userErr" class="text-xs text-red-600 mt-2"></div>
  </div>
  <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto">
    <div class="px-4 py-3"><h3 class="font-semibold">Kayıtlı kullanıcılar (${state.users.length})</h3></div>
    <table class="w-full text-xs min-w-[820px]">
      <thead><tr class="text-slate-400 bg-slate-50 border-y border-slate-100"><th class="text-left px-4 py-2">KULLANICI</th><th class="text-left px-3 py-2">FİRMA</th><th class="text-left px-3 py-2">ROL</th><th class="text-left px-3 py-2">BİRİM</th><th class="text-left px-3 py-2">DURUM</th><th></th></tr></thead>
      <tbody>${state.users.map(u=>{
        const self=u.email===me.email;
        const cf=usersPage.confirm&&usersPage.confirm.email===u.email?usersPage.confirm:null;
        const firm=cust(u.customerId);
        const pending=!u.passwordSet;
        const actions=self?'':cf
          ?`<span class="text-slate-500 mr-1">${cf.type==='delete'?'Silinsin mi?':'Şifre sıfırlansın mı?'}</span><button class="userYes text-red-600 font-medium px-2" data-email="${esc(u.email)}">Evet</button><button class="userNo text-slate-500 px-2">Vazgeç</button>`
          :`${pending&&u.invited===false?`<button class="userInvite text-blue-700 px-2" data-email="${esc(u.email)}">Davet gönder</button>`:`<button class="userNewCode text-blue-700 px-2" data-email="${esc(u.email)}">${u.passwordSet?'Şifreyi sıfırla':'Yeni kod'}</button>`}<button class="userDelete text-red-600 px-2" data-email="${esc(u.email)}">Sil</button>`;
        return `<tr class="border-b border-slate-50">
          <td class="px-4 py-2"><div class="font-medium">${esc(u.name||u.email)}${self?' <span class="text-slate-400 font-normal">(siz)</span>':''}</div>${u.name?`<div class="text-slate-400">${esc(u.email)}</div>`:''}${u.phone?`<div class="text-slate-400">${esc(u.phone)}</div>`:''}</td>
          <td class="px-3 py-2 text-slate-600">${esc(firm.name||'—')}${firm.type==='FACTORY'?' <span class="text-slate-400">(fabrika)</span>':''}</td>
          <td class="px-3 py-2 text-slate-600">${ROLE_LABEL[u.role]}${u.role==='MUSTERI'&&u.canApprove?' <span class="ml-1 px-1.5 py-0.5 rounded bg-blue-50 text-blue-700">onay yetkili</span>':''}</td>
          <td class="px-3 py-2 text-slate-500">${esc(u.unit||'—')}</td>
          <td class="px-3 py-2">${u.passwordSet?'<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Aktif</span>':(u.invited===false?'<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Davet edilmedi</span>':`<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Davet gönderildi</span> <span class="font-mono text-slate-500 ml-1">kod: ${u.code}</span>`)}</td>
          <td class="px-3 py-2 text-right whitespace-nowrap">${actions}</td>
        </tr>`;}).join('')}</tbody>
    </table>
  </div>`;
}

function wireShell(){
  document.getElementById('logoutBtn')?.addEventListener('click',doLogout);
  wireFirms(); wireUsers();
}
function wireFirms(){
  const $=id=>document.getElementById(id);
  $('fName')?.addEventListener('input',()=>{syncFirmForm();const b=$('createFirm');const ok=firmsPage.form.name.trim().length>0;b.disabled=!ok;b.className='mt-3 '+createBtnCls(ok);const p=$('fPrefix');if(p&&!p.value)p.placeholder=suggestPrefix(firmsPage.form.name)||'örn. GKH';});
  $('fPrefix')?.addEventListener('input',e=>{const v=cleanPrefix(e.target.value);if(e.target.value!==v)e.target.value=v;});
  $('fGroup')?.addEventListener('change',e=>{$('fNewGroupWrap').style.display=e.target.value==='__new'?'':'none';});
  $('createFirm')?.addEventListener('click',()=>{
    syncFirmForm(); const f=firmsPage.form; const err=t=>{$('firmErr').textContent=t;};
    const name=f.name.trim(); if(!name) return err('Firma adı gerekli.');
    if(nameTaken(name)) return err('Bu isimde bir firma zaten var.');
    const prefix=cleanPrefix(f.prefix)||suggestPrefix(name);
    if(prefix.length<2) return err('Sipariş no ön eki en az 2 karakter olmalı (A–Z, 0–9).');
    if(prefixTaken(prefix)) return err('“'+prefix+'” ön eki başka bir firmada kullanılıyor; farklı bir ön ek girin.');
    let group=f.group;
    if(group==='__new'){group=f.newGroup.trim(); if(!group) return err('Yeni grup adı girin.'); if(!state.groups.includes(group)) state.groups.push(group);}
    const id='f'+Date.now().toString(36);
    state.customers.push({id,name,prefix,type:f.type,group,camEtiket:f.cam.trim(),sandikEtiket:f.sandik.trim(),contactPerson:''});
    state.nextSeq[prefix]=state.nextSeq[prefix]||1;
    firmsPage.form=freshFirmForm();
    firmsPage.notice='“'+name+'” firması oluşturuldu (ön ek: '+prefix+'). Şimdi bu firmaya kullanıcı atayabilirsiniz.';
    save();render();
  });
  document.querySelectorAll('.fPrefixIn').forEach(el=>el.addEventListener('change',()=>{
    syncFirmForm(); const c=cust(el.dataset.id); const v=cleanPrefix(el.value);
    if(v.length<2||prefixTaken(v,c.id)){firmsPage.tableErr=v.length<2?'Ön ek en az 2 karakter olmalı.':'“'+v+'” ön eki başka bir firmada kullanılıyor.';render();return;}
    c.prefix=v; state.nextSeq[v]=state.nextSeq[v]||1; el.value=v; save();
  }));
  document.querySelectorAll('.fCamIn').forEach(el=>el.addEventListener('change',()=>{cust(el.dataset.id).camEtiket=el.value.trim();save();}));
  document.querySelectorAll('.fSandikIn').forEach(el=>el.addEventListener('change',()=>{cust(el.dataset.id).sandikEtiket=el.value.trim();save();}));
  document.querySelectorAll('.fGroupSel').forEach(el=>el.addEventListener('change',()=>{cust(el.dataset.id).group=el.value;save();}));
  document.querySelectorAll('.fEdit').forEach(el=>el.addEventListener('click',()=>{syncFirmForm();firmsPage.editing=el.dataset.id;render();}));
  document.querySelectorAll('.fEditCancel').forEach(el=>el.addEventListener('click',()=>{syncFirmForm();firmsPage.editing=null;render();}));
  document.querySelectorAll('.fEditSave').forEach(el=>el.addEventListener('click',()=>{
    syncFirmForm(); const inp=document.querySelector('.fEditName'); const v=(inp?inp.value:'').trim(); const c=cust(el.dataset.id);
    if(!v){firmsPage.tableErr='Firma adı boş olamaz.';render();return;}
    if(nameTaken(v,c.id)){firmsPage.tableErr='Bu isimde bir firma zaten var.';render();return;}
    c.name=v; firmsPage.editing=null; save(); render();
  }));
}
function wireUsers(){
  const $=id=>document.getElementById(id);
  ['uEmail','uName','uUnit','uPhone'].forEach(id=>$(id)?.addEventListener('input',updateUserBtn));
  $('uFirm')?.addEventListener('change',updateUserBtn);
  document.querySelectorAll('.roleChip').forEach(b=>b.addEventListener('click',()=>{
    syncUserForm(); const f=usersPage.form; f.role=b.dataset.role;
    const list=firmsForRole(f.role);
    if(!list.some(c=>c.id===f.firm)) f.firm=list.length===1?list[0].id:'';
    if(f.role!=='MUSTERI') f.approve=false;
    render();
  }));
  $('createUser')?.addEventListener('click',()=>{
    syncUserForm(); const f=usersPage.form; const err=t=>{$('userErr').textContent=t;};
    const email=f.email.trim().toLowerCase();
    if(!userFormValid()) return err('E-posta, rol ve firma zorunlu.');
    if(findUser(email)) return err('Bu e-posta ile zaten bir hesap var.');
    const firm=cust(f.firm);
    if(f.role==='MUSTERI'?firm.type!=='CUSTOMER':firm.type!=='FACTORY') return err(f.role==='MUSTERI'?'Müşteri rolü yalnızca müşteri firmasına atanabilir.':'Satış ve çizim rolleri yalnızca fabrikaya atanabilir.');
    const code=newCode();
    state.users.push({email,name:f.name.trim(),unit:f.unit.trim(),phone:f.phone.trim(),role:f.role,customerId:f.firm,canApprove:f.role==='MUSTERI'&&f.approve,invited:f.invite,passwordSet:false,password:null,code});
    usersPage.notice=f.invite
      ?email+' '+firm.name+' firmasına atandı ve davet e-postası gönderildi. Doğrulama kodu: '+code+' (prototipte e-posta gitmediği için burada gösteriliyor).'
      :email+' '+firm.name+' firmasına atandı; davet henüz gönderilmedi. Hazır olduğunuzda satırdaki “Davet gönder” ile gönderebilirsiniz.';
    usersPage.form=freshUserForm(); save(); render();
  });
  document.querySelectorAll('.userInvite').forEach(b=>b.addEventListener('click',()=>{
    const u=findUser(b.dataset.email); if(!u) return; u.invited=true;
    usersPage.notice=u.email+' için davet gönderildi. Doğrulama kodu: '+u.code+' (prototipte burada gösteriliyor).'; save(); render();
  }));
  document.querySelectorAll('.userNewCode').forEach(b=>b.addEventListener('click',()=>{
    const u=findUser(b.dataset.email); if(!u) return;
    if(u.passwordSet) usersPage.confirm={type:'reset',email:u.email}; else u.code=newCode();
    save(); render();
  }));
  document.querySelectorAll('.userDelete').forEach(b=>b.addEventListener('click',()=>{usersPage.confirm={type:'delete',email:b.dataset.email};render();}));
  document.querySelectorAll('.userNo').forEach(b=>b.addEventListener('click',()=>{usersPage.confirm=null;render();}));
  document.querySelectorAll('.userYes').forEach(b=>b.addEventListener('click',()=>{
    const cf=usersPage.confirm; const u=cf&&findUser(cf.email); usersPage.confirm=null;
    if(u&&u.email!==state.session){
      if(cf.type==='delete') state.users=state.users.filter(x=>x.email!==u.email);
      else {u.passwordSet=false;u.password=null;u.code=newCode();u.invited=true;}
    }
    save(); render();
  }));
}

render();
</script>
</body>
</html>
