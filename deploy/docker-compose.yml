# Sunucudaki çalışma düzeni. Bu klasör sunucuda /opt/takip altına kopyalanır; .env yalnızca sunucuda durur.
#   docker compose run --rm tools            → migration uygular + temel verileri yükler
#   docker compose run --rm tools npm run create-admin -- e-posta "Ad Soyad"
#   docker compose up -d                     → uygulamayı başlatır / günceller
name: takip

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: takip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: takip
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takip"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  tools:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}-tools
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN .env içinde tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
