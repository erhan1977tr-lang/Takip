# Sunucudaki çalışma düzeni (deploy/install.sh kurar, deploy/takip.sh yönetir). Kaynak /opt/takip/src,
# ayarlar ve gizli anahtarlar /opt/takip/.env (bu klasördeki .env ona bağlantıdır; git'e girmez).
# Sunucuda doğrudan compose yerine "takip" komutu kullanılır: takip durum | guncelle | smtp | yonetici | yedek | log
# İmajlar sunucuda derlenir: takip:<commit> (uygulama) ve takip:<commit>-tools (migration, seed, betikler).
name: takip

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
    environment:
      POSTGRES_USER: takip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: takip
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takip"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      UPLOAD_DIR: /data/uploads
      CLAMAV_HOST: clamav
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Arka plan işçisi: taranmamış dosyaları antivirüsten geçirir (ileride bildirim gönderimi)
  worker:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}-tools
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      UPLOAD_DIR: /data/uploads
      CLAMAV_HOST: clamav
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Antivirüs (ClamAV). ~1–1,5 GB bellek; ilk açılışta virüs tanımları birkaç dakikada yüklenir.
  # Ulaşılamadığı sürece yüklenen dosyalar "taranmadı" işaretlenir ve işçi sonra tarar.
  clamav:
    build: ./clamav
    image: takip-clamav:latest
    restart: unless-stopped
    logging: *logging
    volumes:
      - clamav-db:/var/lib/clamav

  tools:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}-tools
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      CLAMAV_HOST: clamav
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN .env içinde tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  clamav-db:
  caddy-data:
  caddy-config:
