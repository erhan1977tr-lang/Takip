# Sunucudaki çalışma düzeni (deploy/install.sh kurar, deploy/takip.sh yönetir). Kaynak /opt/takip/src,
# ayarlar ve gizli anahtarlar /opt/takip/.env (bu klasördeki .env ona bağlantıdır; git'e girmez).
# Sunucuda doğrudan compose yerine "takip" komutu kullanılır: takip durum | guncelle | smtp | yonetici | yedek | log
# İmajlar sunucuda derlenir: takip:<commit> (uygulama) ve takip:<commit>-tools (migration, seed, betikler).
name: takip

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
    environment:
      POSTGRES_USER: takip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: takip
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takip"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
    env_file: .env
    # GERÇEK SUNUCU İŞARETİ (karar 151): TAKIP_DEPLOYMENT burada SABİT değerdir — değişken olarak .env'den okunmaz. Compose'da
    # "environment", "env_file"dan önce gelir: .env dosyasına ne yazılırsa yazılsın (TAKIP_DEPLOYMENT=…, boş, başka değer)
    # kapsayıcı bu değeri görür. İşaret varken uygulama, işçi ve araçlar test / geliştirme ayarlarını (DEMO_MODE,
    # MAIL_OUTBOX_DIR, TRANSLATE_FAKE, COOKIE_SECURE=false) YOK SAYAR ve demo verisi betiği çalışmaz (server/env.js).
    # Bu satırı değişkene çevirmeyin, kaldırmayın; uygulama, işçi ve araç servislerinin üçünde de durmalıdır.
    environment:
      TAKIP_DEPLOYMENT: server
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      UPLOAD_DIR: /data/uploads
      CLAMAV_HOST: clamav
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Yükleme biriminin sahipliği (SEC-12, karar 137): işçi artık root değil, uygulamayla aynı kullanıcıyla (1001:1001)
  # çalışır. Eski sürümlerde işçi root'tu ve yazdığı dosyalar (depo PDF'i, ay klasörü, karantina) root'a aitti; bu tek
  # seferlik servis her "compose up"ta (yayın, geri yükleme) işçiden ÖNCE çalışır ve birimde sahibi 1001:1001 olmayan
  # kayıtların YALNIZCA sahipliğini düzeltir. Dosya silmez, taşımaz, adını ya da içeriğini değiştirmez; bağlantıların
  # hedefine dokunmaz (chown -h), birimin dışına çıkmaz (-xdev; başka hiçbir şey bağlı değil, ağ yok). Düzeltilecek kayıt
  # yoksa hiçbir şey yapmaz (yinelenebilir). Her durumda 0 ile biter: sahiplik sorunu yayını durdurmaz, günlüğe yazılır.
  uploads-init:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}
    user: "0:0"
    network_mode: none
    restart: "no"
    logging: *logging
    healthcheck:
      disable: true
    entrypoint: ["sh", "-c"]
    command:
      - |
        n=$$(find /data/uploads -xdev ! \( -uid 1001 -gid 1001 \) -exec chown -h 1001:1001 {} + -print | wc -l)
        echo "yükleme birimi: sahipliği 1001:1001 yapılan kayıt: $$n"
        k=$$(find /data/uploads -xdev ! \( -uid 1001 -gid 1001 \) | wc -l)
        [ "$$k" = 0 ] || echo "UYARI: $$k kayıt hâlâ 1001:1001 değil"
        exit 0
    volumes:
      - uploads:/data/uploads

  # Arka plan işçisi: taranmamış dosyaları antivirüsten geçirir, depo / belge / bildirim e-postalarını ve FGO işlerini yürütür.
  # root DEĞİL: uygulamayla aynı kullanıcı (1001:1001) — yükleme birimine yazdıkları (depo PDF'i, ay klasörü, karantina)
  # uygulamanın da yazabildiği sahiplikle oluşur. İmaj (tools) değişmedi: migration / yönetim komutları root kalır.
  # Ayrıcalıklar (karar 138, YALNIZCA bu serviste): bütün Linux yetenekleri bırakılır (cap_drop: ALL) ve süreç sonradan
  # ayrıcalık edinemez (no-new-privileges: setuid / dosya yeteneği taşıyan programlar yetki kazandırmaz). İşçinin hiçbir
  # yeteneğe ihtiyacı yok: kendi dosyalarını yazar, veritabanına / antivirüse / dış servislere yalnızca istemci olarak bağlanır.
  worker:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}-tools
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    logging: *logging
    env_file: .env
    environment:
      # gerçek sunucu işareti — sabit değer, .env ezemez (karar 151; açıklaması app servisinde)
      TAKIP_DEPLOYMENT: server
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      UPLOAD_DIR: /data/uploads
      CLAMAV_HOST: clamav
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully

  # Antivirüs (ClamAV). ~1–1,5 GB bellek; ilk açılışta virüs tanımları birkaç dakikada yüklenir.
  # Ulaşılamadığı sürece yüklenen dosyalar "taranmadı" işaretlenir ve işçi sonra tarar.
  clamav:
    build: ./clamav
    image: takip-clamav:latest
    restart: unless-stopped
    logging: *logging
    # İmajın kendi denetimi (clamdcheck.sh) "localhost"a bağlanıyor; kapsayıcıda localhost IPv6'ya çözülünce yanıt
    # alamayıp sağlıklı servisi "unhealthy" gösteriyor. Yalnızca test değişir: IPv4 ile PING → PONG.
    # Aralık / zaman aşımı / deneme / başlangıç süresi imajdaki değerlerde kalır.
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep -q '^PONG'"]
    volumes:
      - clamav-db:/var/lib/clamav

  tools:
    image: ${APP_IMAGE:-ghcr.io/erhan1977tr-lang/takip}:${APP_TAG:-latest}-tools
    profiles: ["tools"]
    env_file: .env
    environment:
      # gerçek sunucu işareti — sabit değer, .env ezemez (karar 151): demo verisi betiği burada çalışmaz
      TAKIP_DEPLOYMENT: server
      DATABASE_URL: postgresql://takip:${POSTGRES_PASSWORD}@db:5432/takip?schema=public
      CLAMAV_HOST: clamav
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN .env içinde tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  clamav-db:
  caddy-data:
  caddy-config:
