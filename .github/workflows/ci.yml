name: CI

on:
  push:
    branches: ['**']
  pull_request:

# En az yetki (karar 289): test işi depoyu YALNIZCA OKUR — npm paketleri ve uygulama kodu yazma yetkili jeton varken
# çalışmaz. Üretilen dosyaların (kilit dosyası, migration, IP aralıkları) ve ekran görüntülerinin depoya geri yazılması
# ayrı "geri-yaz" işindedir: o iş npm / uygulama kodu çalıştırmaz, yalnızca izin verilen yolları kopyalar ve yalnızca
# çalışma dallarında yazar — izlenen dala (backend) ve main'e CI hiçbir şey geri yazmaz.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      generated: ${{ steps.generated.outputs.generated }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: takip
          POSTGRES_PASSWORD: takip
          POSTGRES_DB: takip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U takip"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://takip:takip@localhost:5432/takip?schema=public
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      COOKIE_SECURE: 'false'
      APP_URL: http://localhost:3000
      MAIL_OUTBOX_DIR: ${{ github.workspace }}/.outbox
      SCREENSHOT_DIR: ${{ github.workspace }}/.screens
      UPLOAD_DIR: ${{ github.workspace }}/.uploads
      NEXT_TELEMETRY_DISABLED: '1'
      # Not çevirisi: testlerde sahte sağlayıcı — Google'a hiçbir istek gitmez (server/notes/provider.js)
      TRANSLATE_FAKE: '1'
      # Antivirüs: sunucudakiyle aynı ClamAV imajı (deploy/clamav); uçtan uca testler gerçek taramayla çalışır
      CLAMAV_HOST: 127.0.0.1
      # DWG / DXF önizleme hizmeti (karar 283): sunucudakiyle aynı kod (server/cad/service.mjs) ve aynı sabit LibreDWG
      # sürümü; aşağıda önbellekli derlenip başlatılır
      CAD_SERVICE_URL: http://127.0.0.1:3311
      # Panel AI asistanı (karar 290): uygulama imzalı soruyu buraya iletir. e2e/66-panel-asistan.spec.ts gerçek işçi kapısını
      # (server/assistant/panel.js) bu adreste test sürecinde açar; model sahte — OpenAI'ye hiçbir istek gitmez.
      ASSISTANT_PANEL_URL: http://127.0.0.1:3331
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Antivirüs (ClamAV) başlat — testler çalışırken ısınır
        run: |
          docker build -q -t takip-clamav deploy/clamav
          docker run -d --name clamav -p 3310:3310 takip-clamav

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Sürüm numarası artırıldı mı
        # Uygulama kodu değiştiyse package.json sürümü bir önceki gönderimden büyük olmalı (logonun altında görünür)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          before='${{ github.event.before }}'
          git fetch -q --depth=1 origin "$before" 2>/dev/null || { echo "önceki commit alınamadı, atlanıyor"; exit 0; }
          if git diff --quiet "$before" HEAD -- app lib server components assets prisma/schema.prisma prisma/seed prisma/migrations scripts/demo next.config.mjs instrumentation.ts; then
            echo "uygulama kodu değişmedi"; exit 0
          fi
          old=$(git show "$before:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          new=$(node -p "require('./package.json').version")
          echo "önceki: $old  şimdiki: $new"
          node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            process.exit(cmp < 0 ? 0 : 1);
          ' "$old" "$new" || { echo "::error title=Sürüm artırılmadı::Uygulama kodu değişti ama package.json sürümü ($new) önceki gönderimden ($old) büyük değil. Sürümü artırın ve CHANGELOG.md'ye ekleyin."; exit 1; }

      - name: Paketleri kur
        run: |
          # package.json'a yeni paket eklendiyse npm ci kilit dosyası uyuşmazlığıyla durur; o zaman npm install
          # kilit dosyasını günceller ve aşağıdaki adım onu depoya geri yazar.
          # İzlenen dalda (backend) ve main'de kilit dosyası depodakiyle AYNEN kullanılır (geri yazma yok — karar 289).
          if [ -f package-lock.json ] && npm ci --no-audit --no-fund; then echo "npm ci tamam"
          elif [ "$GITHUB_REF_NAME" = backend ] || [ "$GITHUB_REF_NAME" = main ]; then
            echo "::error title=Kilit dosyası uyumsuz::package-lock.json package.json ile uyuşmuyor. Çalışma dalında CI'nin ürettiği kilit dosyasıyla birleştirin."; exit 1
          else scripts/ci-step.sh "npm install" npm install --no-audit --no-fund; fi

      - name: Bağımlılık güvenlik taraması (npm audit)
        # Üretim bağımlılıklarında KRİTİK açık → kırmızı; yüksek / geliştirme bağımlılıkları → uyarı. Kayıt sunucusuna
        # ulaşılamazsa uyarı (tarama yapılamadı) — başarılı sayılmaz, sonuç uyarı olarak görünür.
        run: node scripts/ci-audit.mjs

      - name: Ortam değişkenleri geçerli mi
        run: scripts/ci-step.sh "env:check" npm run env:check

      - name: Prisma şemasını doğrula ve istemciyi üret
        run: |
          scripts/ci-step.sh "prisma validate" npx prisma validate
          scripts/ci-step.sh "prisma generate" npx prisma generate

      - name: İlk migration'ı üret (yoksa)
        run: |
          if [ ! -d prisma/migrations ]; then
            mkdir -p prisma/migrations/0001_init
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0001_init/migration.sql
            printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          fi

      - name: Veritabanını hazırla (migrate deploy)
        run: scripts/ci-step.sh "prisma migrate deploy" npx prisma migrate deploy

      - name: Şema değiştiyse yeni migration üret (yalnızca çalışma dallarında)
        if: github.ref_name != 'main' && github.ref_name != 'backend'
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > /tmp/diff.sql
          if grep -qvE '^\s*(--.*)?$' /tmp/diff.sql; then
            dir="prisma/migrations/$(date -u +%Y%m%d%H%M%S)_ci"
            mkdir -p "$dir" && cp /tmp/diff.sql "$dir/migration.sql"
            echo "Yeni migration: $dir"; cat "$dir/migration.sql"
            scripts/ci-step.sh "prisma migrate deploy (yeni)" npx prisma migrate deploy
          fi

      - name: IP aralıkları (giriş sayfası dili; 30 günden eskiyse yenile)
        run: node scripts/geo/update-ranges.mjs --if-older-than=30 || echo "::warning title=IP aralıkları::RIPE verisi indirilemedi; mevcut veriyle devam ediliyor"

      - name: Üretilen dosyaları ayır (geri yazma ayrı işte)
        id: generated
        if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'backend'
        run: |
          rm -rf "$RUNNER_TEMP/uretilen" && mkdir -p "$RUNNER_TEMP/uretilen"
          git add -N prisma/migrations 2>/dev/null || true
          list=$(git diff --name-only -- package-lock.json prisma/migrations server/geo/ranges.js)
          [ -n "$list" ] || { echo "generated=false" >> "$GITHUB_OUTPUT"; exit 0; }
          printf '%s\n' "$list" | while IFS= read -r f; do
            install -D -m 0644 "$f" "$RUNNER_TEMP/uretilen/$f"
          done
          printf '%s\n' "$list" > "$RUNNER_TEMP/uretilen/.liste"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.generated.outputs.generated == 'true'
        with:
          name: uretilen-dosyalar
          path: ${{ runner.temp }}/uretilen
          include-hidden-files: true
          retention-days: 1

      - name: Migration ile şema uyumlu mu
        run: scripts/ci-step.sh "migration drift" npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Temel veriler (seed, iki kez — tekrar çalıştırılabilir olmalı)
        run: |
          scripts/ci-step.sh "db:seed" npm run db:seed
          scripts/ci-step.sh "db:seed (ikinci kez)" npm run db:seed

      - name: Lint
        # Önce yalnızca hatalar (kırmızı yapar), sonra uyarıların özeti (kırmızı yapmaz)
        run: |
          scripts/ci-step.sh "eslint" npx eslint . --quiet
          npx eslint . | tail -3 || true

      - name: Tip kontrolü
        run: scripts/ci-step.sh "tsc" npx tsc --noEmit

      - name: Birim testleri
        run: scripts/ci-step.sh "npm test" npm test

      - name: Veritabanı testleri (ayrı veritabanı)
        env:
          TEST_DATABASE_URL: postgresql://takip:takip@localhost:5432/takip_test?schema=public
        run: |
          PGPASSWORD=takip psql -h localhost -U takip -d takip -qc 'CREATE DATABASE takip_test'
          DATABASE_URL="$TEST_DATABASE_URL" scripts/ci-step.sh "test db migrate" npx prisma migrate deploy
          scripts/ci-step.sh "test:db" bash -c 'npm run test:db 2>&1 | tee test-db.log; s=${PIPESTATUS[0]}; grep -q "^# skipped 0" test-db.log || { echo "::error title=Veritabanı testleri atlandı::"; exit 1; }; exit $s'

      - name: Derle
        run: scripts/ci-step.sh "next build" npm run build

      - name: Antivirüs hazır mı (en fazla 5 dakika)
        run: |
          node -e "import('./server/files/clamav.js').then(async (m) => {
            for (let i = 0; i < 60; i++) {
              if (await m.ping({ host: '127.0.0.1', port: 3310 })) {
                const r = await m.scanBuffer(m.eicar(), { host: '127.0.0.1', port: 3310 });
                console.log((await m.version({ host: '127.0.0.1', port: 3310 })).raw, JSON.stringify(r));
                process.exit(r.status === 'infected' ? 0 : 1);
              }
              await new Promise((r) => setTimeout(r, 5000));
            }
            process.exit(1);
          })" || { docker logs --tail 60 clamav; exit 1; }

      # Sunucudaki imajla aynı tarif (Dockerfile "libredwg" aşaması): sabit sürüm, SHA-256 doğrulaması, statik dwg2dxf.
      # Örnek DWG'ler LibreDWG'nin kendi test dosyalarıdır (müşteri dosyası değil); uçtan uca test gerçek DWG'yi önizler.
      - name: GNU LibreDWG (önbellek)
        id: libredwg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.libredwg
          key: libredwg-0.14-62ebb73b984f865960f20ed26619ea5f8789d5e3fd088fa40a2598384da81275-${{ runner.os }}-v1

      - name: GNU LibreDWG derle (önbellekte yoksa)
        if: steps.libredwg.outputs.cache-hit != 'true'
        run: |
          set -e
          v=0.14; sum=62ebb73b984f865960f20ed26619ea5f8789d5e3fd088fa40a2598384da81275
          d=$(mktemp -d)
          curl -fsSL --retry 3 -o "$d/l.tar.xz" "https://github.com/LibreDWG/libredwg/releases/download/$v/libredwg-$v.tar.xz"
          echo "$sum  $d/l.tar.xz" | sha256sum -c -
          tar -xJf "$d/l.tar.xz" -C "$d"
          ( cd "$d/libredwg-$v" \
            && ./configure --disable-shared --enable-static --disable-bindings --disable-python --disable-docs --enable-release > /dev/null \
            && make -j"$(nproc)" -C src > /dev/null && make -j"$(nproc)" -C programs dwg2dxf > /dev/null )
          install -D -m 0755 "$d/libredwg-$v/programs/dwg2dxf" ~/.libredwg/bin/dwg2dxf
          mkdir -p ~/.libredwg/ornek
          cp "$d/libredwg-$v/test/test-data/sample_2018.dwg" "$d/libredwg-$v/test/test-data/example_2000.dwg" ~/.libredwg/ornek/
          rm -rf "$d"

      - name: DWG / DXF önizleme hizmetini başlat
        run: |
          ~/.libredwg/bin/dwg2dxf --version
          DWG2DXF_BIN="$HOME/.libredwg/bin/dwg2dxf" CAD_PORT=3311 CAD_HOST=127.0.0.1 nohup node server/cad/service.mjs > cad.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3311/health && exit 0; sleep 1; done
          cat cad.log; exit 1

      - name: Tek ekip test tetikleyicileri (karar 300 — yalnızca test veritabanı)
        # Satışçı / çizimci ayrımından önce yazılmış uçtan uca testler siparişleri doğrudan veritabanına yazar; tetikleyiciler
        # sahibi boş cam siparişini takımın satışçısına (+ çizimcisine) verir (scripts/test/single-team.mjs). Gerçek migration değildir.
        # Takımın satışçısı fiyat-satis@e2e.test (08'de açılır; 05'te satis@e2e.test bilerek kilitlenir) — yoksa ilk satışçı.
        # Fiyat tablosu ataması uygulamadaki gibi açıktır (varsayılan tabloya düşme yok — karar 300).
        run: scripts/ci-step.sh "single-team" node scripts/test/single-team.mjs --no-default-table --prefer-sales fiyat-satis@e2e.test

      - name: Sunucuyu başlat
        run: |
          # Üretimdeki gibi standalone çıktı ile çalıştır
          cp -r .next/static .next/standalone/.next/static
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/login; then echo "sunucu hazır"; exit 0; fi
            sleep 1
          done
          scripts/ci-step.sh "sunucu açılmadı" bash -c 'cat server.log; exit 1'

      - name: Tarayıcıyı kur
        run: scripts/ci-step.sh "playwright install" npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: scripts/ci-step.sh "e2e" bash -c 'npx playwright test 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}'

      - name: Demo ortamı (örnek veriler + demo testleri)
        env:
          DATABASE_URL: postgresql://takip:takip@localhost:5432/takip_demo?schema=public
          DEMO_MODE: '1'
          DEMO_URL: http://127.0.0.1:3001
          APP_URL: http://127.0.0.1:3001
          UPLOAD_DIR: ${{ github.workspace }}/.demo-uploads
          MAIL_OUTBOX_DIR: ${{ github.workspace }}/.demo-outbox
        run: |
          PGPASSWORD=takip psql -h localhost -U takip -d takip -qc 'CREATE DATABASE takip_demo'
          scripts/ci-step.sh "demo migrate" npx prisma migrate deploy
          scripts/ci-step.sh "demo seed" node scripts/demo/seed.mjs
          scripts/ci-step.sh "demo seed (ikinci kez)" node scripts/demo/seed.mjs
          PORT=3001 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > demo-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3001/login && break; sleep 1; done
          scripts/ci-step.sh "demo e2e" bash -c 'npx playwright test e2e/demo.spec.ts 2>&1 | tee demo-e2e.log; exit ${PIPESTATUS[0]}' || { tail -50 demo-server.log; exit 1; }

      # Gerçek sunucu kipi (karar 151, güvenlik denetimi AUD-13): aynı üretim derlemesi ÜÇÜNCÜ bir sunucu olarak, gerçek
      # sunucunun işaretiyle (sunucuda deploy/docker-compose.yml verir) ve sunucuya yanlışlıkla kopyalanmış bir demo / test
      # .env'inin dört ayarıyla başlatılır: DEMO_MODE=1, MAIL_OUTBOX_DIR (aşağıda) + işin genel ortamından COOKIE_SECURE=false
      # ve TRANSLATE_FAKE=1. Beklenen: ayarlar yok sayılır, sunucu kapanmaz (e2e/sunucu-kipi.spec.ts; ana test sunucusuyla
      # — işaretsiz, ayarlar geçerli — aynı testte karşılaştırılır). İşaret yalnızca BU adımın ortamındadır.
      - name: Gerçek sunucu kipi (karar 151) — test / demo ayarları yok sayılır, sunucu kapanmaz
        env:
          TAKIP_DEPLOYMENT: server
          DEMO_MODE: '1'
          SERVER_MODE_URL: http://127.0.0.1:3002
          APP_URL: http://127.0.0.1:3002
          MAIL_OUTBOX_DIR: ${{ github.workspace }}/.sunucu-kipi-outbox
          MAIN_OUTBOX_DIR: ${{ github.workspace }}/.outbox
          SERVER_MODE_LOG: ${{ github.workspace }}/server-mode.log
        run: |
          PORT=3002 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server-mode.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3002/login && break; sleep 1; done
          scripts/ci-step.sh "sunucu kipi e2e" bash -c 'npx playwright test e2e/sunucu-kipi.spec.ts 2>&1 | tee sunucu-kipi-e2e.log; exit ${PIPESTATUS[0]}' || { tail -50 server-mode.log; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'push' && hashFiles('.screens/**') != ''
        with:
          name: ekran-goruntuleri
          path: .screens
          retention-days: 1

      - name: Test hata bağlamı (hata varsa)
        if: failure()
        run: |
          shopt -s nullglob
          for f in e2e.log demo-e2e.log; do
            [ -f "$f" ] && scripts/ci-step.sh "$f hataları" bash -c "grep -nE '✘|Error:|Expected|Received|Timeout|Locator:|waiting for|spec.ts:[0-9]+|^ *[-+] ' '$f' | grep -vE 'attachment|✓|^[0-9]+: +- +[0-9]+ \\[' | head -60; exit 1" || true
          done
          for f in test-results/*/error-context.md; do
            scripts/ci-step.sh "sayfa: $(basename "$(dirname "$f")" | cut -c1-60)" bash -c "sed -n '1,120p' '$f'; exit 1" || true
          done

      - name: Sunucu günlüğü (hata varsa)
        if: failure()
        run: |
          test -f server.log && scripts/ci-step.sh "server.log" bash -c 'tail -n 80 server.log; exit 1' || true

      - name: Docker imajı derlenebiliyor mu
        run: scripts/ci-step.sh "docker build" docker build --target runner -t takip:ci .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-rapor
          path: |
            test-results/
            server.log
          retention-days: 7

  # Geri yazma (karar 289): yazma yetkili jeton YALNIZCA bu iştedir. npm kurulumu, derleme, test ya da depodan gelen kod
  # çalıştırılmaz; test işinin ürettiği dosyalar yalnızca izin verilen yollara (package-lock.json, server/geo/ranges.js,
  # prisma/migrations/<zaman>_ci/migration.sql) kopyalanır. İzlenen dala (backend) ve main'e hiçbir şey yazılmaz; yalnızca
  # ekran görüntüleri ayrı ci-screenshots dalına (her dalın koşusunda) yazılır.
  geri-yaz:
    needs: build-test
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build-test.outputs.generated == 'true'
        with:
          name: uretilen-dosyalar
          path: ${{ runner.temp }}/uretilen

      - name: Üretilen dosyaları depoya geri yaz (yalnızca izin verilen yollar, yalnızca çalışma dallarında)
        if: needs.build-test.outputs.generated == 'true' && github.ref_name != 'main' && github.ref_name != 'backend'
        env:
          DAL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/uretilen"
          while IFS= read -r f; do
            if ! [[ $f == package-lock.json || $f == server/geo/ranges.js || $f =~ ^prisma/migrations/[0-9]{14}_ci/migration\.sql$ ]]; then
              echo "::error title=İzin verilmeyen yol::$f"; exit 1
            fi
            [ -f "$src/$f" ] && [ ! -L "$src/$f" ] || { echo "::error title=Dosya yok::$f"; exit 1; }
            install -D -m 0644 "$src/$f" "$f"
          done < "$src/.liste"
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations server/geo/ranges.js
          if ! git diff --cached --quiet; then
            git commit -m "CI: package-lock.json, migration ve IP aralığı dosyaları"
            git push origin "HEAD:refs/heads/${DAL}"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: ekran
        continue-on-error: true
        with:
          name: ekran-goruntuleri
          path: ${{ runner.temp }}/ekran

      - name: Ekran görüntülerini ci-screenshots dalına yaz
        if: steps.ekran.outcome == 'success'
        env:
          DAL: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/ekran"
          git init -q -b ci-screenshots
          printf 'Kaynak commit: %s\nDal: %s\n' "$GITHUB_SHA" "$DAL" > README.txt
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898279+github-actions[bot]@users.noreply.github.com" commit -qm "Ekran görüntüleri: ${GITHUB_SHA::7}"
