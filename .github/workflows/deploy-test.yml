name: Sunucu kurulumu

# deploy/install.sh ve deploy/takip.sh temiz bir Ubuntu makinede baştan sona denenir:
# kurulum, HTTPS, ilk yönetici, yeniden kurulum (anahtarlar korunur), güncelleme, yalnızca belge değişikliği,
# derlemesi bozuk sürümün yayınlanmaması, sahte IP başlıkları (Caddy), yedek ve şifreli yedek (age) + geri yükleme denemesi,
# Docker derleme önbelleği temizliği (karar 134: yalnızca önbellek silinir; imaj, kapsayıcı, birim, veri ve yedek yerinde),
# işçinin root olmadan (karar 137: sahiplik geçişi, tarama, karantina, depo PDF'i, geri dönüş, geri yükleme) ve ayrıcalıksız
# (karar 138: cap_drop ALL + no-new-privileges, yalnızca işçide) çalışması, istek gövdesi sınırları (karar 141: gerçek Caddy
# arkasında adres kademeleri, eski Caddy sürümleriyle sözdizimi, Caddyfile değişikliğinin yayınla etkin olması).
on:
  push:
    branches: ['**']
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'app/surum/**'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SITE: https://localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Betik denetimi (shellcheck)
        run: |
          # Bulgular not olarak da yayınlanır (günlük dosyası indirilemeyen ortamlar için)
          shellcheck -S warning -f gcc deploy/install.sh deploy/takip.sh deploy/test/cache-housekeeping.sh deploy/test/backup-permissions.sh deploy/test/worker-nonroot.sh deploy/test/body-limits.sh > shellcheck.log \
            || { cat shellcheck.log; echo "::error title=shellcheck::$(head -c 4000 shellcheck.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Derleme önbelleği temizliği — mantık testi (sahte docker; gerçek hiçbir şey silinmez)
        run: bash deploy/test/cache-housekeeping.sh

      - name: Yerel yedek dosyalarının izinleri — mantık testi (sahte docker / rclone, gerçek age; sunucudaki hiçbir şeye dokunulmaz)
        run: |
          sudo apt-get install -y -qq age >/dev/null
          sudo bash deploy/test/backup-permissions.sh

      - name: Kurulum (temiz makine)
        run: |
          # GitHub'ın test makinesinde /opt "varsayılan ACL" taşır (default:other::rwx): altında oluşan dosyalarda umask YOK
          # SAYILIR, her dosya 0666 olur. Gerçek sunucuda böyle bir ACL yoktur (orada dosyalar umask'a uyar). Test ortamı
          # sunucuya benzesin diye kurulum klasörü ACL'siz açılır ve umask'ın geçerli olduğu doğrulanır.
          sudo mkdir -p /opt/takip
          sudo setfacl -b -k /opt/takip
          sudo sh -c 'umask 077; : > /opt/takip/.izin-deneme; m=$(stat -c %a /opt/takip/.izin-deneme); rm -f /opt/takip/.izin-deneme; [ "$m" = 600 ] || { echo "umask /opt/takip altında geçerli değil ($m)"; exit 1; }'
          git checkout -B "$GITHUB_REF_NAME"
          sudo git config --global --add safe.directory '*'
          sudo env TAKIP_REPO_URL="file://$GITHUB_WORKSPACE" TAKIP_SKIP_CI_GATE=1 TAKIP_NO_FIREWALL=1 TAKIP_SKIP_UPGRADE=1 \
            bash deploy/install.sh --branch "$GITHUB_REF_NAME" --domain localhost \
            --admin-email yonetici@kurulum.test --admin-name "Kurulum Testi" --factory "GKH Trading" 2>&1 | tee install.log
          sudo systemctl stop takip-deploy.timer takip-deploy.service || true

      - name: Site ve ilk yönetici
        run: |
          set -x
          curl -fsSk "$SITE/login" | grep -q 'GKH Digital'
          ver=$(jq -r .version package.json)
          curl -fsSk "$SITE/surum" | tee /dev/stderr | jq -e --arg v "$ver" --arg b "${GITHUB_SHA::7}" '.version == $v and .build == $b'
          grep -qE 'Tek kullanımlık kod: .*[0-9]{6}' install.log
          sudo takip durum

      - name: Antivirüs ve arka plan işçisi sunucuda çalışıyor
        run: |
          compose() { sudo docker compose -p takip --env-file /opt/takip/.env -f /opt/takip/src/deploy/docker-compose.yml "$@"; }
          compose ps --status running --services | tee servisler.txt
          grep -qx worker servisler.txt && grep -qx clamav servisler.txt
          for i in $(seq 1 30); do
            if sudo takip antivirus; then exit 0; fi
            sleep 10
          done
          compose logs --tail 60 clamav worker
          exit 1

      - name: CI kapısı (gerçek GitHub API; CI'nin yazdığı commit'te üst commit'in sonucu)
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gate() { sudo env GITHUB_TOKEN="$GH" takip _ci "$1"; }
          [ "$(gate 1e117de)" = success ]
          [ "$(gate 7c76031)" = failure ]
          [ "$(gate d75ccda)" = failure ]
          [ "$(gate cf140a5)" = success ]
          # Geçersiz anahtar: yayın yapılmaz ("pending"), hata kayda geçer
          [ "$(sudo env GITHUB_TOKEN=gecersiz takip _ci 1e117de 2>/dev/null)" = pending ]
          sudo grep -q 'GitHub anahtarı geçersiz' /opt/takip/logs/deploy.log

      - name: Yeniden kurulum anahtarları korur
        run: |
          before=$(sudo grep '^AUTH_SECRET=' /opt/takip/.env)
          sudo env TAKIP_REPO_URL="file://$GITHUB_WORKSPACE" TAKIP_SKIP_CI_GATE=1 TAKIP_NO_FIREWALL=1 TAKIP_SKIP_UPGRADE=1 \
            bash deploy/install.sh --branch "$GITHUB_REF_NAME" --domain localhost 2>&1 | tee install2.log
          sudo systemctl stop takip-deploy.timer takip-deploy.service || true
          [ "$before" = "$(sudo grep '^AUTH_SECRET=' /opt/takip/.env)" ]
          grep -q 'Yönetici hesabı zaten var' install2.log
          grep -q 'zaten yayında' install2.log

      - name: Güncelleme yayınlanır
        run: |
          git config user.name ci && git config user.email ci@kurulum.test
          echo "// güncelleme testi $(date +%s)" >> app/surum/route.ts
          git commit -qam "güncelleme testi"
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle
          new=$(git rev-parse --short=7 HEAD)
          curl -fsSk "$SITE/surum" | jq -e --arg b "$new" '.build == $b'

      - name: Derleme önbelleği temizliği — gerçek Docker (yalnızca önbellek silinir; imaj, kapsayıcı, birim, veri ve yedek yerinde)
        run: |
          set -Ex
          # Hata olursa: hangi satır / komut, temizlik kayıtları ve önbellek durumu not olarak yayınlanır (günlük indirilemeyen ortamlar için)
          trap 'rc=$? cmd=$BASH_COMMAND; set +x; { echo "satır $LINENO (çıkış $rc): $cmd"; for f in c1.log c1b.log c2.log c3.log npm.log; do if [ -f "$f" ]; then echo "--- $f"; tail -n 12 "$f"; fi; done; echo "--- docker system df"; sudo docker system df; echo "--- fark"; for f in volumes images containers backups db upload; do if [ -f "sonra.$f" ]; then diff "once.$f" "sonra.$f" | head -8; fi; done; } 2>&1 | tail -c 5000 | sed "s/%/%25/g" | sed ":a;N;\$!ba;s/\n/%0A/g" | sed "s/^/::error title=Önbellek testi::/"' ERR
          compose() { sudo docker compose -p takip --env-file /opt/takip/.env -f /opt/takip/src/deploy/docker-compose.yml "$@"; }
          cache() { sudo docker system df --format '{{.Type}}|{{.Size}}' | grep '^Build Cache|' | cut -d'|' -f2; }
          bytes() { echo "$1" | awk '{ match($1, /^[0-9.]+/); n = substr($1, 1, RLENGTH); u = toupper(substr($1, RLENGTH + 1)); m = (u == "B") ? 1 : (u == "KB") ? 1e3 : (u == "MB") ? 1e6 : (u == "GB") ? 1e9 : 1e12; printf "%.0f\n", n * m }'; }
          # Temizliğin dokunmaması gereken her şeyin dökümü: birimler, imajlar (kimlikleriyle), kapsayıcılar (durumlarıyla),
          # yedek klasörü, veritabanı içeriği, yüklenen dosya
          snapshot() {
            sudo docker volume ls -q | sort > "$1.volumes"
            sudo docker images --no-trunc --format '{{.Repository}}:{{.Tag}} {{.ID}}' | sort > "$1.images"
            sudo docker ps -a --no-trunc --format '{{.ID}} {{.Names}} {{.Image}} {{.State}}' | sort > "$1.containers"
            sudo ls -la --time-style=+%s /opt/takip/backups > "$1.backups"
            compose exec -T db psql -U takip -d takip -Atc 'select count(*) from "User"; select email from "User" order by email' > "$1.db"
            compose exec -T app cat /data/uploads/onbellek-testi.txt > "$1.upload"
          }
          # 0. İki derlemeden sonra: önbelleğin tamamı yayındaki / bir önceki imajla ortak (ayrıca yer tutmaz) → sınırın altında
          sudo takip cache
          sudo takip cache temizle | tee c1.log
          grep -q 'aşılmadı, temizlik yok' c1.log

          # Yalnızca SÜRÜM NUMARASI değişen yayın (her gerçek yayında olan): bağımlılık katmanı (npm ci, ~1,2 GB) yeniden
          # kurulmaz, önbellekten gelir — her yayında bir kopyası daha birikmez. Uygulama yeni sürüm numarasını gösterir.
          jq '.version = "9.9.9"' package.json > package.json.yeni && mv package.json.yeni package.json
          git commit -qam "önbellek testi: yalnızca sürüm numarası"
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle
          v=$(git rev-parse HEAD)
          curl -fsSk "$SITE/surum" | tee /dev/stderr | jq -e --arg b "${v::7}" '.version == "9.9.9" and .build == $b'
          sudo grep -m1 -A1 'RUN if \[ -f package-lock.json \]' "/opt/takip/logs/derleme-${v::7}.log" | tee npm.log
          grep -q 'CACHED' npm.log
          # Bir yayın daha: artık yayında olmayan sürümlerin imajları silindiği için onların derleme katmanları yalnızca
          # önbellekte kalır (sunucuda biriken de budur)
          echo "// önbellek testi $(date +%s)" >> app/surum/route.ts
          git commit -qam "önbellek testi: birikim"
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle

          cur=$(sudo cat /opt/takip/state/deployed)
          prev=$v
          [ "$cur" = "$(git rev-parse HEAD)" ]
          # Yayındaki ve geri dönüş (bir önceki) imajları yerinde
          sudo docker image inspect "takip:$cur" "takip:$cur-tools" "takip:$prev" "takip:$prev-tools" >/dev/null
          # Temizlikle ilgisi olmayan "sahipsiz" şeyler: kullanılmayan birim (içinde veri), durmuş kapsayıcı, kullanılmayan imaj
          # etiketi — "docker system prune" / "volume prune" / "image prune -a" olsaydı silinirlerdi
          compose exec -T app sh -c 'echo onbellek-testi > /data/uploads/onbellek-testi.txt'
          sudo docker volume create onbellek-testi-birim >/dev/null
          sudo docker run --rm -v onbellek-testi-birim:/v caddy:2 sh -c 'echo veri > /v/dosya'
          sudo docker create --name onbellek-testi-durmus caddy:2 true >/dev/null
          sudo docker tag caddy:2 onbellek-testi:kullanilmayan
          snapshot once

          # Bilgi: derleme katmanlarının boyutu (hangi adım ne kadar önbellek üretiyor) ve Docker sürümü
          {
            sudo docker version --format 'Docker {{.Server.Version}}'; sudo docker buildx version || true
            sudo docker builder prune --help | grep -E 'reserved-space|keep-storage|max-used-space' || true
            echo "--- tools imajı (builder aşaması) katmanları"; sudo docker history --format '{{.Size}}\t{{.CreatedBy}}' "takip:$cur-tools" | cut -c1-120 | head -14
            echo "--- runner imajı katmanları"; sudo docker history --format '{{.Size}}\t{{.CreatedBy}}' "takip:$cur" | cut -c1-120 | head -14
            echo "--- .next içeriği (tools imajı)"; sudo docker run --rm "takip:$cur-tools" sh -c 'du -sh .next .next/cache .next/standalone node_modules 2>/dev/null' || true
            echo "--- imajlar"; sudo docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E '^takip' | sed -E 's/:([0-9a-f]{7})[0-9a-f]+/:\1/'
            echo "--- en büyük önbellek kayıtları"; sudo docker buildx du --verbose 2>/dev/null | awk '/^Description:/ { d = substr($0, index($0, $2)) } /^Size:/ { print $2 "\t" substr(d, 1, 90) }' | sort -hr | head -14 || true
            echo "--- docker system df"; sudo docker system df
          } 2>&1 | tee katmanlar.txt
          echo "::notice title=Derleme katmanları::$(grep -v '^+ ' katmanlar.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

          # 1. Varsayılan eşikle (10 GB): önbellek sınırın altında → hiçbir şey silinmez
          b0=$(cache)
          sudo takip cache temizle | tee c1b.log
          grep -q 'aşılmadı, temizlik yok' c1b.log
          [ "$(cache)" = "$b0" ]

          # 2. Sınır aşıldı (deneme için küçük eşik): kullanılmayan derleme önbelleği silinir, yer GERÇEKTEN açılır
          before=$(bytes "$b0")
          [ "$before" -gt 300000000 ]
          sudo env TAKIP_CACHE_LIMIT_BYTES=300000000 TAKIP_CACHE_KEEP_BYTES=100000000 takip cache temizle | tee c2.log
          grep -q 'derleme önbelleği (önce): ' c2.log
          grep -Eq 'önbellek temizliği: docker builder prune --all --force( --(reserved-space|keep-storage) 100000000)?$' c2.log
          grep -q 'önbellek temizliği sonucu: ' c2.log
          grep -q 'derleme önbelleği (sonra): ' c2.log
          grep -Eq '  disk \(.*\): .* dolu \(' c2.log
          if grep -q 'başarısız\|hâlâ sınırın üstünde' c2.log; then echo "temizlik yer açamadı"; exit 1; fi
          after=$(bytes "$(cache)")
          sudo docker system df
          [ "$after" -le 300000000 ]
          [ "$after" -lt "$before" ]
          sudo tail -n 8 /opt/takip/logs/deploy.log | grep -q 'derleme önbelleği (sonra)'
          echo "::notice title=Önbellek temizliği (gerçek Docker)::$(sed 's/%/%25/g' c2.log | sed ':a;N;$!ba;s/\n/%0A/g')"

          # 3. Dokunulmaması gerekenler birebir yerinde: birimler, imajlar (yayındaki + geri dönüş + kullanılmayan etiket),
          #    kapsayıcılar (çalışanlar çalışıyor, durmuş olan duruyor), yedekler, veritabanı içeriği, yüklenen dosya
          snapshot sonra
          for f in volumes images containers backups db upload; do diff "once.$f" "sonra.$f"; done
          grep -q '^onbellek-testi$' sonra.upload
          sudo docker run --rm -v onbellek-testi-birim:/v caddy:2 cat /v/dosya | grep -qx veri
          for v in takip_db-data takip_uploads takip_clamav-db takip_caddy-data takip_caddy-config onbellek-testi-birim; do grep -qx "$v" sonra.volumes; done
          sudo docker image inspect "takip:$cur" "takip:$cur-tools" "takip:$prev" "takip:$prev-tools" onbellek-testi:kullanilmayan >/dev/null
          sudo docker inspect -f '{{.State.Status}}' onbellek-testi-durmus | grep -qx created
          curl -fsSk "$SITE/login" | grep -q 'GKH Digital'
          curl -fsSk "$SITE/surum" | jq -e --arg b "${cur::7}" '.build == $b'
          # İmajlar yalnızca listede değil, çalıştırılabilir durumda (katmanları silinmemiş)
          compose run --rm tools node -e "console.log('tools imajı çalışıyor')" | grep -q 'tools imajı çalışıyor'
          sudo docker run --rm --entrypoint node "takip:$prev" -e "console.log('geri dönüş imajı çalışıyor')" | grep -q 'geri dönüş imajı çalışıyor'
          sudo takip durum

          # 4. Temizlikten sonra yayın çalışır ve yayının SONUNDAKİ otomatik denetim de sınırı uygular
          echo "// önbellek testi $(date +%s)" >> app/surum/route.ts
          git commit -qam "önbellek temizliği testi"
          new=$(git rev-parse HEAD)
          sudo env TAKIP_SKIP_CI_GATE=1 TAKIP_CACHE_LIMIT_BYTES=300000000 TAKIP_CACHE_KEEP_BYTES=100000000 takip guncelle | tee c3.log
          curl -fsSk "$SITE/surum" | jq -e --arg b "${new::7}" '.build == $b'
          # Yayının sonunda önbellek denetimi kendiliğinden çalıştı (temizlikten hemen sonra biriken yok: sınırın altında)
          grep -q 'derleme önbelleği' c3.log
          [ "$(bytes "$(cache)")" -le 300000000 ]
          [ "$(sudo cat /opt/takip/state/cache-checked)" = "$new" ]
          # Yayındaki + bir önceki imaj tutulur (mevcut geri dönüş kuralı); birimler ve veri yerinde
          sudo docker image inspect "takip:$new" "takip:$new-tools" "takip:$cur" "takip:$cur-tools" >/dev/null
          sudo docker volume ls -q | sort | diff - once.volumes
          compose exec -T app cat /data/uploads/onbellek-testi.txt | grep -qx onbellek-testi
          compose exec -T db psql -U takip -d takip -Atc 'select email from "User" order by email' | grep -q 'yonetici@kurulum.test'
          sudo docker run --rm -v onbellek-testi-birim:/v caddy:2 cat /v/dosya | grep -qx veri

          # 5. Yayını aracın önceki sürümü yaptıysa (işaret yok): bir sonraki denetimde bir kez çalışır, sonra yinelenmez
          sudo rm -f /opt/takip/state/cache-checked
          n1=$(sudo grep -c 'derleme önbelleği' /opt/takip/logs/deploy.log)
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle
          n2=$(sudo grep -c 'derleme önbelleği' /opt/takip/logs/deploy.log)
          [ "$n2" -eq $((n1 + 1)) ]
          [ "$(sudo cat /opt/takip/state/cache-checked)" = "$new" ]
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle
          [ "$(sudo grep -c 'derleme önbelleği' /opt/takip/logs/deploy.log)" -eq "$n2" ]

          sudo docker rm onbellek-testi-durmus >/dev/null
          sudo docker rmi onbellek-testi:kullanilmayan >/dev/null
          sudo docker volume rm onbellek-testi-birim >/dev/null

      - name: İşçi root değil ve ayrıcalıksız (SEC-12) — gerçek Docker — 1001 + cap_drop ALL + no-new-privileges ile tarama / karantina / depo PDF'i, root işçiden geçiş (gerçek yayın), geri dönüş
        run: bash deploy/test/worker-nonroot.sh

      - name: Yalnızca belge değişikliği yeniden derlenmez
        run: |
          echo "test" >> docs/decisions.md
          git commit -qam "belge testi"
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle | tee belge.log
          grep -q 'yalnızca test/belge değişti' belge.log
          [ "$(sudo cat /opt/takip/state/deployed)" = "$(git rev-parse HEAD)" ]

      - name: İstek gövdesi sınırları (AUD-4, karar 141) — gerçek Caddy — giriş ve olağan adresler 2 MB, yönetim Excel 6 MB, yükleme sayfaları 260 MB; eski Caddy sürümleri
        run: bash deploy/test/body-limits.sh

      - name: Caddyfile değişikliği yayınla etkin olur (sınır değişir, Caddy yeni dosyayı okur)
        run: bash deploy/test/body-limits.sh yayin

      - name: Derlemesi bozuk sürüm yayınlanmaz, site çalışmaya devam eder
        run: |
          prev=$(curl -fsSk "$SITE/surum" | jq -r .build)
          echo "export const bozuk: number = 'metin';" > lib/bozuk.ts
          echo "import { bozuk } from '@/lib/bozuk'; export const x = bozuk;" >> app/surum/route.ts
          git add -A && git commit -qm "bozuk sürüm testi"
          if sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle; then echo "bozuk sürüm yayınlanmamalıydı"; exit 1; fi
          curl -fsSk "$SITE/surum" | jq -e --arg b "$prev" '.build == $b'
          sudo grep -q 'derleme başarısız' /opt/takip/logs/deploy.log
          # Başarısız derlemeden sonra da önbellek sınırı denetlenir (disk dolduysa kendini toparlar)
          sudo grep -A3 'derleme başarısız' /opt/takip/logs/deploy.log | grep -q 'derleme önbelleği'
          # Aynı commit bir daha denenmez
          sudo env TAKIP_SKIP_CI_GATE=1 takip guncelle | grep -q 'daha önce yayınlanamadı'

      - name: Sahte IP başlıkları Caddy'de etkisiz (SEC-01)
        run: |
          # İstemcinin yazdığı X-Forwarded-For / CF-Connecting-IP / CF-IPCountry / X-Real-IP uygulamaya ulaşmaz:
          # giriş ekranının dili sahte "Türkiye" adresine göre değişmez (gerçek bağlantı yerel → tarayıcı dili: Romence)
          curl -fsSk -H 'Accept-Language: ro' -H 'X-Forwarded-For: 78.180.10.10' -H 'CF-Connecting-IP: 78.180.10.10' \
            -H 'CF-IPCountry: TR' -H 'X-Real-IP: 78.180.10.10' -H 'True-Client-IP: 78.180.10.10' "$SITE/login" -o login.html
          grep -q '<html lang="ro"' login.html
          # Karşı kontrol: aynı istek Türkçe tarayıcıyla Türkçe açılır (dil yalnızca güvenilir bilgilerden belirlenir)
          curl -fsSk -H 'Accept-Language: tr' "$SITE/login" | grep -q '<html lang="tr"'

      - name: Etkinlik adresi Caddy arkasında — kaynak denetimi gerçek kurulumda çalışır (karar 135)
        run: |
          # Oturumu uzatan tek adres (POST /oturum/etkinlik). Tarayıcının aynı siteden yolladığı istek vekil arkasında da
          # kaynak denetiminden geçmelidir (yoksa çalışan kullanıcılar 30 dakikada bir atılırdı); başka site reddedilir.
          code() { curl -sk -o /dev/null -w '%{http_code}' -X POST "$SITE/oturum/etkinlik" -H 'Content-Type: application/json' -d '{"idle":0}' "$@"; }
          same=$(code -H 'X-Takip-Activity: 1' -H "Origin: $SITE")
          fetch=$(code -H 'X-Takip-Activity: 1' -H "Origin: $SITE" -H 'Sec-Fetch-Site: same-origin')
          other=$(code -H 'X-Takip-Activity: 1' -H 'Origin: https://kotu.example')
          cross=$(code -H 'X-Takip-Activity: 1' -H "Origin: $SITE" -H 'Sec-Fetch-Site: cross-site')
          bare=$(code -H "Origin: $SITE")
          get=$(curl -sk -o /dev/null -w '%{http_code}' -H 'X-Takip-Activity: 1' "$SITE/oturum/etkinlik")
          echo "aynı site: $same / $fetch · başka site: $other / $cross · başlıksız: $bare · GET: $get"
          # Aynı site: denetimden geçer, oturum olmadığı için 401 (403 değil)
          [ "$same" = 401 ]
          [ "$fetch" = 401 ]
          [ "$other" = 403 ]
          [ "$cross" = 403 ]
          [ "$bare" = 403 ]
          [ "$get" = 405 ]
          echo "::notice title=Etkinlik adresi (Caddy arkasında)::aynı site $same / $fetch · başka site $other / $cross · başlıksız $bare · GET $get"

      - name: Yedek (şifresiz — mevcut akış), Drive kopyası ve restore-test
        run: |
          # Google Drive yerine yerel bir klasör (rclone ":local:" uzak adresi); akış aynı: kopyala + md5 doğrula
          sudo apt-get install -y -qq rclone age >/dev/null
          echo 'BACKUP_REMOTE=:local:/tmp/takip-drive' | sudo tee -a /opt/takip/.env >/dev/null
          set -E
          # Hata olursa: hangi satır / komut, yedek klasörünün izinleri ve ilgili kayıtlar not olarak yayınlanır
          trap 'rc=$? cmd=$BASH_COMMAND; { echo "satır $LINENO (çıkış $rc): $cmd"; echo "--- yedek klasörü"; sudo stat -c "%a %U %n" /opt/takip/backups; sudo find /opt/takip/backups -mindepth 1 -printf "%m %u %f\n" | sort -k3 | tail -n 30; for f in yedek.log rt.log rt-drive.log kur.log rt2.log; do if [ -f "$f" ]; then echo "--- $f"; tail -n 12 "$f"; fi; done; echo "--- backup.log"; sudo tail -n 20 /opt/takip/logs/backup.log; } 2>&1 | tail -c 5000 | sed "s/%/%25/g" | sed ":a;N;\$!ba;s/\n/%0A/g" | sed "s/^/::error title=Yedek testi::/"' ERR
          day=$(TZ=Europe/Bucharest date +%F)
          sudo takip yedek 2>&1 | tee yedek.log
          sudo ls -la /opt/takip/backups
          sudo sh -c 'ls /opt/takip/backups/db-*.dump' | grep -q dump
          sudo ls /tmp/takip-drive/database | grep -qE '^db-.*\.dump$'
          sudo ls /tmp/takip-drive/uploads | grep -qE '^dosyalar-.*\.tgz$'
          sudo takip restore-test "$day" > rt.log 2>&1 || { cat rt.log; exit 1; }
          cat rt.log
          grep -q 'Kaynak             : LOCAL' rt.log
          grep -q '✔ Veritabanı geçici veritabanına yüklendi' rt.log
          # İzinler (karar 136): klasör 0700; gerçek pg_dump / kapsayıcıdaki tar ile oluşan HER yedek dosyası 0600
          # (yayın öncesi alınan güvenlik yedekleri dahil)
          private() { [ "$(sudo stat -c '%a %U' /opt/takip/backups)" = "700 root" ] && l=$(sudo find /opt/takip/backups -type f ! -perm 600 -printf '%m %p\n') && { [ -z "$l" ] || { echo "0600 olmayan yedek dosyası: $l"; return 1; }; }; }
          private
          sudo sh -c 'ls /opt/takip/backups/db-*-once-*.dump' | grep -q dump
          # Drive'dan indirilen yedek de (gerçek rclone) yerelde 0600 yazılır
          sudo mkdir -p /root/izin-kenar
          sudo sh -c "mv /opt/takip/backups/db-${day}_* /opt/takip/backups/dosyalar-${day}_* /root/izin-kenar/"
          sudo takip restore-test "$day" > rt-drive.log 2>&1 || { cat rt-drive.log; exit 1; }
          grep -q 'Kaynak             : GOOGLE DRIVE' rt-drive.log
          sudo sh -c "ls /opt/takip/backups/db-${day}_*.dump /opt/takip/backups/dosyalar-${day}_*.tgz" | grep -c . | grep -qx 2
          private
          sudo rm -rf /root/izin-kenar
          echo "::notice title=Yedek izinleri (gerçek Docker + rclone)::$(sudo find /opt/takip/backups -type f -printf '%m\n' | sort | uniq -c | tr '\n' ' ') · klasör $(sudo stat -c '%a' /opt/takip/backups)"
          sudo takip yedek-sifreleme > enc.log 2>&1 || { cat enc.log; exit 1; }
          cat enc.log
          grep -q 'KAPALI' enc.log
          sudo systemctl list-timers --all | grep -E 'takip-(deploy|backup)'

      - name: Şifreli yedek (age) — kurulum denemesi, gece yedeği, Drive'dan çözerek geri yükleme, anahtar kaybı, anahtar yenileme
        run: |
          set -E
          # Hata olursa: hangi satır / komut, yedek klasörünün izinleri ve ilgili kayıtlar not olarak yayınlanır
          trap 'rc=$? cmd=$BASH_COMMAND; { echo "satır $LINENO (çıkış $rc): $cmd"; echo "--- yedek klasörü"; sudo stat -c "%a %U %n" /opt/takip/backups; sudo find /opt/takip/backups -mindepth 1 -printf "%m %u %f\n" | sort -k3 | tail -n 30; for f in yedek.log rt.log rt-drive.log kur.log rt2.log; do if [ -f "$f" ]; then echo "--- $f"; tail -n 12 "$f"; fi; done; echo "--- backup.log"; sudo tail -n 20 /opt/takip/logs/backup.log; } 2>&1 | tail -c 5000 | sed "s/%/%25/g" | sed ":a;N;\$!ba;s/\n/%0A/g" | sed "s/^/::error title=Yedek testi::/"' ERR
          day=$(TZ=Europe/Bucharest date +%F)
          drive=/tmp/takip-drive
          key=/opt/takip/backup-key.txt
          plain_before=$(sudo find "$drive" -type f ! -name '*.age' | wc -l)
          [ "$plain_before" = 2 ]

          # 1. Onay verilmeden (etkileşimsiz) şifreleme AÇILMAZ; yedek akışı değişmez
          if sudo takip yedek-sifreleme kur </dev/null >onaysiz.log 2>&1; then cat onaysiz.log; echo "onaysız açılmamalıydı"; exit 1; fi
          sudo test ! -e /opt/takip/state/backup-encryption

          # 2. Kurulum: anahtar üretilir, şifreli yedek alınır, Drive'dan indirilip ÇÖZÜLEREK geri yüklenir; ancak sonra açılır
          sudo env TAKIP_ASSUME_KEY_SAVED=1 takip yedek-sifreleme kur > kur.log 2>&1 || { cat kur.log; exit 1; }
          cat kur.log
          grep -q 'Kaynak             : GOOGLE DRIVE (şifreli)' kur.log
          grep -q '✔ Şifre çözüldü' kur.log
          grep -q '✔ Veritabanı geçici veritabanına yüklendi' kur.log
          grep -q '✔ Yedek şifreleme AÇIK' kur.log
          [ "$(sudo stat -c '%a %U' "$key")" = "600 root" ]
          sudo test -s /opt/takip/state/backup-encryption

          # 3. Gece yedeği: Drive'a yalnızca şifreli kopya gider; şifresiz eski yedekler YERİNDE (silinmez)
          sleep 1
          sudo takip yedek
          [ "$(sudo find "$drive" -type f ! -name '*.age' | wc -l)" = "$plain_before" ]
          [ "$(sudo find "$drive" -type f -name '*.age' | wc -l)" = 4 ]
          f=$(sudo sh -c "ls $drive/database/*.age" | tail -1)
          u=$(sudo sh -c "ls $drive/uploads/*.age" | tail -1)
          sudo head -c 21 "$f" | grep -q 'age-encryption.org/v1'
          if sudo head -c 5 "$f" | grep -q PGDMP; then echo "Drive kopyası şifresiz"; exit 1; fi
          # Yerel kopya açık (şifresiz) ve yalnızca root'un okuyabildiği klasörde durur
          [ "$(sudo stat -c '%a' /opt/takip/backups)" = 700 ]
          sudo sh -c 'ls /opt/takip/backups/db-*.dump' | grep -q dump
          if sudo sh -c 'ls /opt/takip/backups/*.age' 2>/dev/null | grep -q age; then echo "yerelde şifreli artık kalmamalı"; exit 1; fi
          private() { [ "$(sudo stat -c '%a %U' /opt/takip/backups)" = "700 root" ] && l=$(sudo find /opt/takip/backups -type f ! -perm 600 -printf '%m %p\n') && { [ -z "$l" ] || { echo "0600 olmayan yedek dosyası: $l"; return 1; }; }; }
          private

          # 4. Anahtar hiçbir yere sızmamış: Drive, günlükler, durum dosyaları, yedek klasörü, komut çıktısı, yedeğin içi
          if sudo grep -rqa 'AGE-SECRET-KEY' "$drive" /opt/takip/logs /opt/takip/state /opt/takip/backups; then echo "anahtar sızmış"; exit 1; fi
          if grep -q 'AGE-SECRET-KEY' kur.log; then echo "anahtar çıktıda"; exit 1; fi
          if sudo age -d -i "$key" "$u" | tar -tz | grep -q 'backup-key'; then echo "anahtar arşivde"; exit 1; fi

          # 5. restore-test: Drive'daki ŞİFRELİ kopya indirilir, çözülür, arşiv okunur, geçici veritabanına yüklenir; geçici klasör kalmaz
          sudo takip restore-test "$day" > rt2.log 2>&1 || { cat rt2.log; exit 1; }
          cat rt2.log
          grep -q 'GOOGLE DRIVE (şifreli)' rt2.log
          grep -q '✔ Şifre çözüldü' rt2.log
          grep -Eq 'Dosya arşivi okunuyor \([0-9]+ dosya\)' rt2.log
          grep -q '✔ Veritabanı geçici veritabanına yüklendi' rt2.log
          [ -z "$(sudo find /opt/takip/backups -maxdepth 1 -name '.gecici.*')" ]
          # Canlı veritabanı yerinde, geçici veritabanı silinmiş
          curl -fsSk "$SITE/login" >/dev/null
          # Bağımsız doğrulama (takip aracı olmadan, yalnızca age + anahtar): gerçek bir pg_dump ve okunabilir bir arşiv
          sudo age -d -i "$key" "$f" | head -c 5 | grep -q PGDMP
          sudo age -d -i "$key" "$u" | tar -tz >/dev/null

          # 6. Sunucu tamamen kaybolmuş gibi: yerel yedek yok, şifreleme işareti yok — yalnızca sunucu DIŞINDA saklanan anahtar geri konmuş
          sudo mkdir -p /root/kenar
          sudo sh -c 'mv /opt/takip/backups/db-* /opt/takip/backups/dosyalar-* /root/kenar/'
          sudo mv /opt/takip/state/backup-encryption /root/kenar/isaret
          sudo cp -p "$key" /root/kenar/anahtar
          sudo takip restore-test "$day" > rt3.log 2>&1 || { cat rt3.log; exit 1; }
          grep -q 'GOOGLE DRIVE (şifreli)' rt3.log
          grep -q '✔ Veritabanı geçici veritabanına yüklendi' rt3.log

          # 7. Anahtar yoksa: açık hata; hiçbir şey değişmez
          sudo sh -c 'rm -f /opt/takip/backups/db-* /opt/takip/backups/dosyalar-*'
          sudo rm -f "$key"
          if sudo takip restore-test "$day" > rt4.log 2>&1; then cat rt4.log; echo "anahtarsız geri yüklenmemeliydi"; exit 1; fi
          grep -q 'anahtar dosyası yok' rt4.log

          # 8. Yanlış anahtar: gece yedeği "tamam" demez, Drive'a ŞİFRESİZ hiçbir şey gitmez, yerel yedek yine alınır
          sudo sh -c "umask 077; age-keygen -o $key" 2>/dev/null
          sudo mv /root/kenar/isaret /opt/takip/state/backup-encryption
          n=$(sudo find "$drive" -type f | wc -l)
          sleep 1
          if sudo takip yedek > yk.log 2>&1; then cat yk.log; echo "yanlış anahtarla yedek tamam dememeliydi"; exit 1; fi
          grep -q "Drive'a hiçbir şey gönderilmedi" yk.log
          [ "$(sudo find "$drive" -type f | wc -l)" = "$n" ]
          sudo sh -c 'ls /opt/takip/backups/db-*.dump' | grep -q dump
          if sudo takip restore-test "$day" > rt5.log 2>&1; then cat rt5.log; echo "yanlış anahtarla çözülmemeliydi"; exit 1; fi
          grep -q 'şifresi çözülemedi' rt5.log
          sudo cp -p /root/kenar/anahtar "$key"

          # 9. Anahtar yenileme: yeni anahtar etkin; eski anahtar dosyada kalır, eski yedekler açılmaya devam eder
          old=$(sudo cat /opt/takip/state/backup-encryption)
          sleep 1
          sudo env TAKIP_ASSUME_KEY_SAVED=1 takip yedek-sifreleme yenile > yenile.log 2>&1 || { cat yenile.log; exit 1; }
          [ "$old" != "$(sudo cat /opt/takip/state/backup-encryption)" ]
          [ "$(sudo grep -c AGE-SECRET-KEY "$key")" = 2 ]
          [ "$(sudo stat -c '%a %U' "$key")" = "600 root" ]
          sudo age -d -i "$key" "$f" | head -c 5 | grep -q PGDMP
          newest=$(sudo sh -c "ls $drive/database/*.age" | tail -1)
          if sudo age -d -i /root/kenar/anahtar "$newest" >/dev/null 2>&1; then echo "yeni yedek eski anahtarla açılmamalı"; exit 1; fi
          sudo takip restore-test "$day" > rt6.log 2>&1 || { cat rt6.log; exit 1; }
          grep -q 'GOOGLE DRIVE (şifreli)' rt6.log

          # 10. Durum: açık; şifresiz eski yedekler sayılır ve yerinde durur
          sudo takip yedek-sifreleme > enc2.log 2>&1 || { cat enc2.log; exit 1; }
          cat enc2.log
          grep -q 'AÇIK' enc2.log
          grep -Eq "[0-9]+ şifreli, $plain_before ŞİFRESİZ" enc2.log
          [ "$(sudo find "$drive" -type f ! -name '*.age' | wc -l)" = "$plain_before" ]
          sudo takip durum > durum.log 2>&1 || true
          grep -q 'Google Drive kopyası şifreli' durum.log
          private
          if sudo grep -rqa 'AGE-SECRET-KEY' "$drive" /opt/takip/logs /opt/takip/state /opt/takip/backups; then echo "anahtar sızmış"; exit 1; fi

      - name: Yedekten geri yükleme (gerçek — takip restore) — dosyalar 1001:1001, işçi root değil ve ayrıcalıksız, restore-test yine geçer
        run: |
          set -E
          trap 'rc=$? cmd=$BASH_COMMAND; { echo "satır $LINENO (çıkış $rc): $cmd"; for f in geri.log rt-son.log; do if [ -f "$f" ]; then echo "--- $f"; tail -n 15 "$f"; fi; done; echo "--- backup.log"; sudo tail -n 20 /opt/takip/logs/backup.log; } 2>&1 | tail -c 5000 | sed "s/%/%25/g" | sed ":a;N;\$!ba;s/\n/%0A/g" | sed "s/^/::error title=Geri yükleme testi::/"' ERR
          compose() { sudo docker compose -p takip --env-file /opt/takip/.env -f /opt/takip/src/deploy/docker-compose.yml "$@"; }
          day=$(TZ=Europe/Bucharest date +%F)
          # Yedekten SONRA oluşan kayıt: geri yüklemeyle kaybolmalı (gerçekten yedeğe dönüldüğünün kanıtı)
          compose exec -T app sh -c 'echo sonradan > /data/uploads/yedekten-sonra.txt'
          # Onay sorusu terminalden okunur (/dev/tty): komut sahte terminalde çalışır, soru göründüğünde yedeğin tarihi yazılır
          sudo python3 deploy/test/tty-answer.py 'Onaylamak' "$day" takip restore "$day" < /dev/null > geri.log 2>&1 || { cat geri.log; exit 1; }
          cat geri.log
          grep -q '✔ Geri yüklendi' geri.log
          if compose exec -T app test -e /data/uploads/yedekten-sonra.txt; then echo "dosyalar yedeğe dönmedi"; exit 1; fi
          # Geri yüklenen dosyaların tamamı 1001:1001; işçi yine root değil, çalışıyor, izin hatası yok; kayıtlı dosyalar yerinde
          bash deploy/test/worker-nonroot.sh son
          # Geri yüklemeden sonra yedek denemesi de geçer
          sudo takip restore-test "$day" > rt-son.log 2>&1 || { cat rt-son.log; exit 1; }
          grep -q '✔ Veritabanı geçici veritabanına yüklendi' rt-son.log

      - name: Günlükler (hata varsa)
        if: failure()
        run: |
          sudo tail -n 60 /opt/takip/logs/*.log || true
          sudo docker compose -p takip --env-file /opt/takip/.env -f /opt/takip/src/deploy/docker-compose.yml ps || true
          sudo docker compose -p takip --env-file /opt/takip/.env -f /opt/takip/src/deploy/docker-compose.yml logs --tail 80 || true
          # Özet sayfasında da görünsün (günlük dosyası indirilemeyen ortamlar için)
          { sudo tail -n 40 /opt/takip/logs/*.log; sudo docker compose -p takip --env-file /opt/takip/.env -f /opt/takip/src/deploy/docker-compose.yml logs --tail 25 app worker clamav; } 2>&1 \
            | tail -c 6000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=Sunucu günlükleri::/' || true
